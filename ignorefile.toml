version = 1

[[gitignore.section]]

[[gitignore.section.rule]]
note = """
SPDX-FileCopyrightText: RUST-TOOLCHAIN contributors

SPDX-License-Identifier: MIT OR Apache-2.0"""

[[gitignore.section.rule]]
ignore = ["node_modules"]
note = "dependencies (bun install)"

[[gitignore.section.rule]]
ignore = ["out", "*.tgz"]
note = "output"

[[gitignore.section.rule]]
ignore = ["coverage", "*.lcov"]
note = "code coverage"

[[gitignore.section.rule]]
ignore = ["logs", "_.log", "report.[0-9]_.[0-9]_.[0-9]_.[0-9]_.json", "/scorecard.json"]
note = "logs"

[[gitignore.section.rule]]
ignore = [".env", ".env.development.local", ".env.test.local", ".env.production.local", ".env.local"]
note = "dotenv environment variable files"

[[gitignore.section.rule]]
ignore = [".eslintcache", ".cache", "*.tsbuildinfo"]
note = "caches"

[[gitignore.section.rule]]
ignore = [".venv"]
note = "Python virtual env"

[[gitignore.section.rule]]
ignore = [".idea"]
note = "IntelliJ based IDEs"

[[gitignore.section.rule]]
ignore = [".DS_Store"]
note = "Finder (MacOS) folder config"

[[gitignore.section.rule]]
add = ["/.act/README.md"]
ignore = ["/.act/**"]
note = "Nektos/ACT"

[[gitignore.section.rule]]
ignore = ["/**/.rumdl_cache/"]
note = "Rumdl"

[[gitignore.section.rule]]
ignore = [".playwright-mcp/"]
note = """
Playwright MCP scratch output (page snapshots, screenshots). Written to the
working directory by the browser tooling, never part of the project."""

[[gitignore.section.rule]]
ignore = ["docs/.vitepress/cache/", "docs/.vitepress/dist/"]
note = """
VitePress build artifacts — the dep cache alone is ~2.8 MB of prebundled
JS and source maps, which trips hk's check-added-large-files."""

[[gitignore.section.rule]]
add = ["CLAUDE.md", "AGENTS.md", "opencode.json"]
note = "Add"

[[gitignore.section.rule]]
ignore = ["/**/build/", "/**/.docusaurus/"]
note = "Docusaurus build artifacts"

[[gitignore.section.rule]]
ignore = ["/**/.stryker-tmp/"]
note = "Stryker"
