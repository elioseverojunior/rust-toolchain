<!--
SPDX-FileCopyrightText: RUST-TOOLCHAIN contributors

SPDX-License-Identifier: MIT OR Apache-2.0

Background and type for social-card.png, the Open Graph preview.

This file is NOT the finished card. build-icons.sh renders it at 1200x630 and
then composites logos/rust-toolchain-and-cache.svg into the panel reserved at
(96,180). The logo is ~1500 paths; inlining it here would bury seventy lines of
layout in it and make this file unreadable. Run build-icons.sh, never
rsvg-convert on this file alone — doing so produces a card with a hole in it.

1200x630 is the size Open Graph consumers crop toward. Everything that must
survive is kept inside a ~60px margin, because Slack, Discord and X each crop
the edges differently and only the centre is common to all of them.

Text is set in Helvetica with a sans-serif fallback, and NOT in a webfont. An
SVG rasterised offline resolves fonts against the rendering machine, so a
webfont reference would silently fall back to whatever fontconfig picks and the
committed PNG would depend on who ran the command.

The logo sits on a white panel rather than straight on the field. Its gear ring
is near-black and its toolbox is dark grey, both of which lose their silhouette
against #1f5572 — checked by rendering all three candidate fields side by side.
The panel is the same shape language as the app icon, so the card and the
favicon read as the same product.

Three layer labels, not the two the previous card carried. The logo draws three
bands and `CACHE_LAYER_IDS` is now genuinely three — registry, build and bin,
the last shipped in Phase C — so the diagram and the code finally agree.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="rust-toolchain — install Rust and cache cargo in one action">
  <title>rust-toolchain — install Rust and cache cargo in one action</title>

  <rect width="1200" height="630" fill="#1f5572"/>

  <!-- A single accent rule rather than a border: a full border is the first
       thing an aggressive crop eats, and its loss looks like a mistake. -->
  <rect x="0" y="0" width="1200" height="10" fill="#f0883e"/>

  <!-- The panel the logo is composited into. Kept 12px larger than the 300x304
       render on every side, so the logo never touches the panel edge.

       Its y must stay in step with the composite offset in build-icons.sh
       (currently +96+225). They are two halves of one number and nothing checks
       that they agree; a mismatch shows up as the logo sitting off its panel. -->
  <rect x="84" y="213" width="324" height="328" rx="38" fill="#ffffff"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="96" y="149" font-size="72" font-weight="bold" fill="#ffffff">rust-toolchain</text>
    <text x="96" y="193" font-size="28" fill="#9ec8e0">A GitHub Action</text>

    <text x="452" y="297" font-size="40" font-weight="bold" fill="#ffffff">Install Rust and cache</text>
    <text x="452" y="347" font-size="40" font-weight="bold" fill="#ffffff">cargo in one action</text>

    <text x="452" y="407" font-size="24" fill="#9ec8e0">Reads your rust-toolchain.toml. Keys the cache</text>
    <text x="452" y="439" font-size="24" fill="#9ec8e0">in layers, so a compiler bump does not</text>
    <text x="452" y="471" font-size="24" fill="#9ec8e0">re-download the crates it never touched.</text>
  </g>

  <!-- The three cache layers, named. Swatches rather than leader lines: the logo
       already draws the stack, so this is a legend for it. The fills are
       sampled from the rendered logo rather than eyeballed, so the legend and
       the bands it explains are the same colour. -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#bcd7e8">
    <rect x="452" y="519" width="18" height="18" rx="4" fill="#f7ac2a"/>
    <text x="482" y="535">registry</text>
    <rect x="600" y="519" width="18" height="18" rx="4" fill="#44c1a7"/>
    <text x="630" y="535">build</text>
    <rect x="724" y="519" width="18" height="18" rx="4" fill="#3e86c8"/>
    <text x="754" y="535">bin</text>
  </g>
</svg>
