name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: cicd-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  GITVERSION_SPEC: ${{ vars.GITVERSION_SPEC || '6.x' }}

jobs:
  # ──────────────────────────────────────────────
  #  1.  Setup — shared bootstrap for all jobs
  # ──────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

  # ──────────────────────────────────────────────
  #  2.  Lint — HK project lints
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    needs: [setup]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run HK Lints
        run: hk check --all

  # ──────────────────────────────────────────────
  #  3a. Test
  # ──────────────────────────────────────────────
  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run Tests
        run: bun run test:coverage

  # ──────────────────────────────────────────────
  #  3b. SAST — CodeQL static analysis
  # ──────────────────────────────────────────────
  sast:
    name: SAST
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  # ──────────────────────────────────────────────
  #  4.  Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    needs: [test, sast]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Build
        shell: bash -l {0}
        run: |
          set -eo pipefail

          echo "::group::Building"
          bun run build
          echo "::endgroup::"

      - name: Assert dist is up-to-date
        shell: bash -l {0}
        run: |
          set -eo pipefail

          echo "::group::Git Diff"
          if ! git diff --exit-code --quiet dist/; then
            echo "::error::dist/index.js is stale — run 'bun run build' locally and commit the result"
            git diff dist/
            exit 1
          fi
          echo "::endgroup::"

  # ──────────────────────────────────────────────
  #  5.  E2E — run the action itself, on real runners
  # ──────────────────────────────────────────────
  #
  # The unit tests exercise `run()` behind injected dependencies, so nothing
  # in CI ever parsed `action.yml` as action metadata or resolved an output
  # expression. A literal `${{ … }}` in an input description once shipped to
  # main because of that: it is opaque prose to YAML, rumdl, Prettier,
  # actionlint and hk alike, and only a runner loading the metadata rejects
  # it. This job is that runner.
  e2e:
    name: E2E
    needs: [build]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Write rust-toolchain.toml
        shell: bash
        run: |
          set -eo pipefail

          cat > rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "1.90"
          profile = "minimal"
          components = ["clippy"]
          EOF
          cat rust-toolchain.toml

      # No `with:` beyond the cache inputs on purpose — this asserts the
      # TOML-first contract, which is the action's headline behaviour.
      #
      # `cache-workspaces` points at the probe crate created below rather than
      # at the repository root. This repository has no Rust crate, so the
      # default `. -> target` names a directory that never exists — which is
      # how an exclusion assertion here stayed vacuous through eight reviews.
      - name: Run Rust Toolchain Action
        id: rust-toolchain
        uses: ./
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('bun.lock') }}
          cache-key-suffix: ci
          cache-workspaces: e2e-probe -> e2e-probe/target

      # Values arrive through env rather than interpolated into the script, so
      # an output containing shell metacharacters cannot execute.
      - name: Verify Resolved Outputs
        shell: bash
        env:
          NAME: ${{ steps.rust-toolchain.outputs.name }}
          TOOLCHAIN: ${{ steps.rust-toolchain.outputs.toolchain }}
          PROFILE: ${{ steps.rust-toolchain.outputs.profile }}
          COMPONENTS: ${{ steps.rust-toolchain.outputs.components }}
          CACHEKEY: ${{ steps.rust-toolchain.outputs.cachekey }}
          CACHEKEY_FULL: ${{ steps.rust-toolchain.outputs.cachekey-full }}
        run: |
          set -eo pipefail

          printf 'name=%s toolchain=%s profile=%s components=%s\n' \
            "$NAME" "$TOOLCHAIN" "$PROFILE" "$COMPONENTS"
          printf 'cachekey=%s cachekey-full=%s\n' "$CACHEKEY" "$CACHEKEY_FULL"

          # The toml is the only configuration source here, so every value
          # below proves it was read, parsed and applied.
          [[ "$NAME" == "1.90" ]]      || { echo "::error::name is '$NAME', expected 1.90 from the toml"; exit 1; }
          [[ "$TOOLCHAIN" == "$NAME" ]] || { echo "::error::toolchain and name disagree"; exit 1; }
          [[ "$PROFILE" == "minimal" ]] || { echo "::error::profile is '$PROFILE', expected minimal from the toml"; exit 1; }
          [[ "$COMPONENTS" == *clippy* ]] || { echo "::error::components '$COMPONENTS' lost the toml's clippy"; exit 1; }
          [[ ${#CACHEKEY} -eq 12 ]]     || { echo "::error::cachekey '$CACHEKEY' is not 12 chars"; exit 1; }
          [[ "$CACHEKEY_FULL" == "$CACHEKEY"-* ]] || { echo "::error::cachekey-full does not extend cachekey"; exit 1; }

      # Also the only place the README's restore-keys recipe is evaluated by a
      # real runner. Its block scalar must keep both lines at identical
      # indentation, or the join separator gains leading spaces.
      - name: Verify Cache Output
        shell: bash
        env:
          CACHE_JSON: ${{ steps.rust-toolchain.outputs.cache }}
          REGISTRY_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.registry.key }}
          BUILD_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.build.key }}
          CACHEKEY_FULL: ${{ steps.rust-toolchain.outputs.cachekey-full }}
          REGISTRY_RESTORE_KEYS: |
            ${{ join(fromJSON(steps.rust-toolchain.outputs.cache).layers.registry.restoreKeys, '
            ') }}
        run: |
          set -eo pipefail

          echo "cache: $CACHE_JSON"
          echo "registry key: $REGISTRY_KEY"
          echo "build key: $BUILD_KEY"
          echo "registry restore-keys:"
          echo "$REGISTRY_RESTORE_KEYS"

          [[ -n "$REGISTRY_KEY" ]] || { echo "::error::registry cache key is empty"; exit 1; }
          [[ -n "$BUILD_KEY" ]]    || { echo "::error::build cache key is empty"; exit 1; }

          # The layer invariants, asserted rather than assumed: the registry
          # key must not carry the toolchain digest, and the build key must.
          [[ "$REGISTRY_KEY" != *"$CACHEKEY_FULL"* ]] \
            || { echo "::error::registry key carries the toolchain digest; a rustc bump would re-download every crate"; exit 1; }
          [[ "$BUILD_KEY" == *"$CACHEKEY_FULL"* ]] \
            || { echo "::error::build key lacks the toolchain digest; it would restore artifacts cargo discards"; exit 1; }

          # The widest rung is the bare layer-os-arch prefix, and `-x` demands
          # a whole-line match — a re-indented block scalar would prepend
          # spaces and fail here.
          grep -qx "registry-${RUNNER_OS}-${RUNNER_ARCH}-" <<<"$REGISTRY_RESTORE_KEYS" \
            || { echo "::error::join() did not produce one restore key per line"; exit 1; }

      - name: Verify The Toolchain Actually Works
        shell: bash
        env:
          NAME: ${{ steps.rust-toolchain.outputs.name }}
        run: |
          set -eo pipefail

          rustc --version
          cargo --version
          cargo clippy --version

          # RUSTUP_TOOLCHAIN is what makes the resolved channel win in later
          # steps; this step is a later step, so it is the real assertion.
          [[ -n "${RUSTUP_TOOLCHAIN:-}" ]] || { echo "::error::RUSTUP_TOOLCHAIN was not exported"; exit 1; }
          [[ "$RUSTUP_TOOLCHAIN" == "$NAME" ]] \
            || { echo "::error::RUSTUP_TOOLCHAIN is '$RUSTUP_TOOLCHAIN', expected '$NAME'"; exit 1; }
          rustc --version | grep -q "1\.90" \
            || { echo "::error::rustc is not the 1.90 the toml asked for"; exit 1; }

      # A real crate, so there is a real `target/` for the post step to save.
      # Without one the build layer resolves to nothing, `saveCache` refuses an
      # empty path set, and the whole save path is never executed — which is
      # how the negation globs shipped excluding nothing.
      #
      # `cfg-if` is deliberate, not decoration: it is tiny and dependency-free,
      # and downloading it is what populates `$CARGO_HOME/registry`, without
      # which the registry layer has nothing to save either.
      #
      # CARGO_INCREMENTAL=1 overrides the `0` the action exports into
      # GITHUB_ENV (a step's own `env:` wins), so `incremental/` actually
      # exists to be excluded. The build key is unaffected: CARGO_INCREMENTAL
      # is on `hashBuildEnv`'s deny-list precisely because the action sets it
      # itself. `--examples` gives the other exclusion something to bite on.
      - name: Build A Probe Crate
        shell: bash
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -eo pipefail

          mkdir -p e2e-probe/src e2e-probe/examples
          cat > e2e-probe/Cargo.toml <<'EOF'
          [package]
          name = "e2e-probe"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          cfg-if = "1"
          EOF
          # Deliberately does not reference cfg-if. `cfg_if!` is an item macro,
          # not an expression one, so the obvious one-liner does not compile —
          # and cargo builds a declared dependency whether or not it is used,
          # which is all this needs it for.
          echo 'fn main() { println!("e2e probe"); }' > e2e-probe/src/main.rs
          echo 'fn main() { println!("hello"); }' > e2e-probe/examples/hello.rs

          cargo build --manifest-path e2e-probe/Cargo.toml --bins --examples

          # The exclusion assertion in the warm job is only meaningful if the
          # things it looks for exist here first. Fail loudly rather than
          # leaving that job asserting on something that can never be present.
          find e2e-probe/target -type d -name incremental | grep -q . \
            || { echo "::error::no incremental/ was produced, so the exclusion assertion downstream would be vacuous"; exit 1; }
          find e2e-probe/target -type d -name examples | grep -q . \
            || { echo "::error::no examples/ was produced, so the exclusion assertion downstream would be vacuous"; exit 1; }

      # A second invocation in the same job. It cannot observe a hit on
      # anything this job saves — `post:` runs only after every other step in
      # the job finishes — so the warm-restore proof lives in the separate
      # `E2E Warm Cache` job below, which `needs:` this one.
      #
      # What this invocation does prove is that the derived keys do not move
      # between two invocations. They did: the action exports CARGO_INCREMENTAL
      # and friends through GITHUB_ENV, so the second invocation used to read
      # its own predecessor's output back as caller-supplied environment and
      # derive a different `envHash` — e3b0c442 then dd704211 — and therefore a
      # `build` key nothing would ever restore.
      #
      # The suffix differs on purpose. With an identical suffix both
      # invocations' post steps race to save the `registry` layer under the
      # same key, one loses, and every CI run across three operating systems
      # emits a warning that means nothing — which is how a warning channel
      # stops being read.
      - name: Run Rust Toolchain Action Again (Same Job, Different Suffix)
        id: rust-toolchain-second
        uses: ./
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('bun.lock') }}
          cache-key-suffix: ci-second
          cache-workspaces: e2e-probe -> e2e-probe/target

      - name: Verify The Keys Do Not Move Between Invocations
        shell: bash
        env:
          FIRST_BUILD_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.build.key }}
          SECOND_BUILD_KEY: ${{ fromJSON(steps.rust-toolchain-second.outputs.cache).layers.build.key }}
          FIRST_REGISTRY_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.registry.key }}
          SECOND_REGISTRY_KEY: ${{ fromJSON(steps.rust-toolchain-second.outputs.cache).layers.registry.key }}
        run: |
          set -eo pipefail

          echo "first  build key: $FIRST_BUILD_KEY"
          echo "second build key: $SECOND_BUILD_KEY"
          echo "first  registry key: $FIRST_REGISTRY_KEY"
          echo "second registry key: $SECOND_REGISTRY_KEY"

          # The two invocations differ in exactly one input, so their keys must
          # differ in exactly one segment. Anything else means a segment moved
          # on its own — and the only segment that can is `envHash`, which the
          # action's own GITHUB_ENV exports used to shift.
          [[ "${FIRST_BUILD_KEY/-ci-/-ci-second-}" == "$SECOND_BUILD_KEY" ]] \
            || { echo "::error::the build key changed by more than the suffix between two same-job invocations; envHash is not stable across the action's own exports"; exit 1; }
          [[ "${FIRST_REGISTRY_KEY/-ci-/-ci-second-}" == "$SECOND_REGISTRY_KEY" ]] \
            || { echo "::error::the registry key changed by more than the suffix between two same-job invocations"; exit 1; }

  # ──────────────────────────────────────────────
  #  5b. E2E Warm Cache — the only proof the save path works
  # ──────────────────────────────────────────────
  #
  # `needs: [e2e]`, and that is the entire point. A job's `post:` steps run
  # after every other step in that job, so no invocation inside `e2e` can ever
  # observe an entry `e2e` itself saved. A dependent job can: it does not start
  # until `e2e` has fully completed, post steps included.
  #
  # Until this job existed, `saveCache`, the manifest, the negation patterns
  # and tar had never run successfully anywhere — which is how a `buildPaths`
  # that excluded nothing survived eight reviews. The two assertions below are
  # the only end-to-end evidence that the save half of the lifecycle works at
  # all.
  e2e-warm:
    name: E2E Warm Cache
    needs: [e2e]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      # Byte-identical to the E2E job's, because the toolchain it resolves
      # feeds `cachekey-full`, which is a segment of the build key. A different
      # channel here would derive a different key and miss by construction.
      - name: Write rust-toolchain.toml
        shell: bash
        run: |
          set -eo pipefail

          cat > rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "1.90"
          profile = "minimal"
          components = ["clippy"]
          EOF

      # Same suffix, same lock hash, same workspace mapping as the E2E job's
      # first invocation — so this restores exactly what that job's post step
      # saved. The probe crate is deliberately *not* recreated: restoring is
      # what has to put `e2e-probe/target` on disk, and building it first would
      # let a broken restore pass unnoticed.
      - name: Restore The Cache Saved By The Previous Job
        id: rust-toolchain
        uses: ./
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('bun.lock') }}
          cache-key-suffix: ci
          cache-workspaces: e2e-probe -> e2e-probe/target

      - name: Verify The Warm Restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-toolchain.outputs.cache-hit }}
          CACHE_JSON: ${{ steps.rust-toolchain.outputs.cache }}
        run: |
          set -eo pipefail

          echo "cache-hit: $CACHE_HIT"
          echo "cache: $CACHE_JSON"

          # The previous job saved both layers, so both must match exactly.
          # Anything less means the save path failed somewhere the warnings
          # were not read.
          [[ "$CACHE_HIT" == "true" ]] \
            || { echo "::error::cache-hit is '$CACHE_HIT'; the previous job's post step did not save both layers under the keys this job derives"; exit 1; }

          [[ -d e2e-probe/target ]] \
            || { echo "::error::the build layer restored no target directory"; exit 1; }
          find e2e-probe/target -type f | head -20

      # The assertion the whole exclusion mechanism exists for, and the one
      # that would have caught its being a no-op. Both directories provably
      # existed when the previous job saved — that job fails if they do not —
      # so their absence here is the exclusion working rather than an artefact
      # of nothing having been built.
      - name: Verify The Exclusions Reached The Archive
        shell: bash
        run: |
          set -eo pipefail

          if find e2e-probe/target -type d -name incremental | grep -q .; then
            echo "::error::an incremental directory survived into the restored cache; the negation globs excluded nothing"
            find e2e-probe/target -type d -name incremental
            exit 1
          fi
          if find e2e-probe/target -type d -name examples | grep -q .; then
            echo "::error::an examples directory survived into the restored cache; the negation globs excluded nothing"
            find e2e-probe/target -type d -name examples
            exit 1
          fi
          echo "no incremental/ or examples/ under the restored target dir"

  # ──────────────────────────────────────────────
  #  6.  Release — only on push to default branch
  # ──────────────────────────────────────────────
  release:
    name: Release
    needs: [build, e2e, e2e-warm]
    if: >
      github.ref_name == github.event.repository.default_branch
      && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Cache GitVersion Tool
        id: cache-gitversion
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/hostedtoolcache/GitVersion.Tool
            ~/.dotnet/tools
          key: gitversion-${{ runner.os }}-${{ runner.arch }}-${{ env.GITVERSION_SPEC }}
          restore-keys: |
            gitversion-${{ runner.os }}-${{ runner.arch }}-
            gitversion-${{ runner.os }}-

      - name: Install GitVersion
        id: install-gitversion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: ${{ env.GITVERSION_SPEC }}
          preferLatestVersion: true

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: Determine Working Branch
        id: working-branch
        shell: bash
        run: |
          set -eo pipefail
          if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]]; then
            WORKING_BRANCH="release/v${{ steps.gitversion.outputs.semVer }}"
          else
            WORKING_BRANCH="prerelease/v${{ steps.gitversion.outputs.semVer }}"
          fi
          echo "branch=${WORKING_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Working Branch: ${WORKING_BRANCH}"

      - name: Skip prerelease versions
        if: steps.gitversion.outputs.PreReleaseLabel != ''
        run: |
          echo "Skipping release for prerelease version: ${{ steps.gitversion.outputs.semVer }}"
          exit 0

      - name: Update Workflow Files With New Version
        id: update-workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          echo "Creating/Updating Working branch: ${{ steps.working-branch.outputs.branch }}"
          git checkout -B "${{ steps.working-branch.outputs.branch }}"

          echo "Updating Workflow files to version v${{ steps.gitversion.outputs.semVer }}"

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          NEW_VERSION="v${{ steps.gitversion.outputs.semVer }}"

          find .github -type f \( -name "*.yml" -o -name "*.yaml" \) ! -name "_release.yml" \
            | while read -r file; do
            sed -i -E "s#(${REPO_OWNER}/${REPO_NAME}/.+)@(main|v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.]+)?)#\1@${NEW_VERSION}#g" "$file"
          done

          git add .github
          git commit -m "chore: Update action references to v${{ steps.gitversion.outputs.semVer }} [skip ci]" \
            || echo "No changes to commit"
          git push -u origin "${{ steps.working-branch.outputs.branch }}" --force

      - name: Tag
        id: tag
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Tag Information"
          echo "::group::Tagger Function"
          function tagger() {
            VERSION="$1"
            echo "Releasing Version: ${VERSION}"
            TAG_EXISTS=$(git ls-remote -q --tags | grep -q "refs/tags/${VERSION}$" && echo true || echo false)
            if [[ "${TAG_EXISTS}" = true ]];
            then
              HAS_RELEASE=$(gh release list --json tagName -q '.[].tagName' | grep -E "^(${VERSION})$" && echo true || echo false)
              if [[ "${HAS_RELEASE}" == true ]];
              then
                gh release delete --yes "${VERSION}"
              fi
              git push origin --delete "${VERSION}"
              git tag -d "${VERSION}"
            fi

            echo "::group::Tagging Version ${VERSION}"
            git tag -a "${VERSION}" -m "chore: Release Version ${VERSION}"
            git push -f --tags --follow-tags
            # NOTE: no `git push --set-upstream origin <ref>` here. On
            # pull_request events github.ref_name is the virtual merge
            # ref like 9/merge, which isn't a pushable branch — push
            # fails with "src refspec 9/merge does not match any" and
            # leaks an error into the CI log. Tags are already pushed
            # above via --follow-tags; set-upstream was redundant on
            # main pushes and broken on PR events.
            echo "::endgroup::"
          }
          echo "::endgroup::"

          echo "::group::Tagging Version v${{ steps.gitversion.outputs.semVer }}"
          tagger "v${{ steps.gitversion.outputs.semVer }}"
          echo "::endgroup::"

          if [[ "${{ github.ref_name  }}" == "${{ github.event.repository.default_branch }}" && "${{ github.event_name }}" != "pull_request" ]];
          then
            echo "::group::Tagging Version v${{ steps.gitversion.outputs.majorMinorPatch }}"
            tagger "v${{ steps.gitversion.outputs.majorMinorPatch }}"
            echo "::endgroup::"

            echo "::group::Tagging Version v${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}"
            tagger "v${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}"
            echo "::endgroup::"

            echo "::group::Tagging Version v${{ steps.gitversion.outputs.major }}"
            tagger "v${{ steps.gitversion.outputs.major }}"
            echo "::endgroup::"
          fi
          echo "::endgroup::"

      - name: Versions
        id: versions
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Latest Released Tags Output"
          # Latest GitHub release — the full-semver entry created by
          # the `gh release create` step on previous runs. `gh release
          # view` (no arg) resolves to the latest release by published
          # date. Exits non-zero when there are no releases yet; the
          # `|| true` fallback keeps the variable empty without failing
          # the step. On first-ever release, both variables below stay
          # empty strings — the Build Changelog step's `fromTag` input
          # accepts empty (action auto-detects or uses empty_template).
          RELEASED_RELEASE_DESC=$(
            gh release view \
              --json tagName,isPrerelease,publishedAt \
              --jq '"\(.tagName) [\(if .isPrerelease then "prerelease" else "stable" end), \(.publishedAt)]"' \
              2>/dev/null || echo "(no releases yet)"
          )
          echo "Latest GitHub release: ${RELEASED_RELEASE_DESC}"

          echo ""
          # Rolling umbrella tags are force-pushed on every release by
          # the Tag step. They exist as git tags WITHOUT corresponding
          # `gh release` entries, so we enumerate them via `git tag -l`
          # + semver-pattern filters. Tags were fetched during Checkout
          # (`fetch-tags: true`).
          echo "Rolling umbrella tags (git-only, no GitHub release):"
          ALL_TAGS=$(git tag -l 'v*' --sort=-v:refname 2>/dev/null || true)
          RELEASED_SEMVER_GIT=$(printf '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' | head -1)
          RELEASED_MMP=$(printf '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          RELEASED_MM=$(printf  '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+$' | head -1)
          RELEASED_M=$(printf   '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+$' | head -1)
          echo "  SemVer:          ${RELEASED_SEMVER_GIT:-none}"
          echo "  MajorMinorPatch: ${RELEASED_MMP:-none}"
          echo "  MajorMinor:      ${RELEASED_MM:-none}"
          echo "  Major:           ${RELEASED_M:-none}"
          echo "::endgroup::"

          echo "::group::GitVersion Tags Output"
          LATEST_SEMVER="v${{ steps.gitversion.outputs.semVer }}"
          LATEST_MMP="v${{ steps.gitversion.outputs.majorMinorPatch }}"
          LATEST_MM="v${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}"
          LATEST_M="v${{ steps.gitversion.outputs.major }}"

          echo ""
          echo "  SemVer:          ${LATEST_SEMVER:-none}"
          echo "  MajorMinorPatch: ${LATEST_MMP:-none}"
          echo "  MajorMinor:      ${LATEST_MM:-none}"
          echo "  Major:           ${LATEST_M:-none}"
          echo "::endgroup::"

          echo "::group::Relased Configuration"
          # Step outputs consumed by subsequent steps (Build Changelog
          # uses released-semver for fromTag, next-semver for toTag).
          # On first-ever release, released-semver is empty — callers
          # must handle that (mikepenz/release-changelog-builder-action
          # treats empty fromTag as "auto-detect" and falls back to
          # the config's empty_template if no PRs are found).
          # We use the git tag (RELEASED_SEMVER_GIT) rather than the
          # GitHub release tag (RELEASED_SEMVER_TAG) so that releases
          # work even before the first gh release create succeeds.
          IS_FIRST_RELEASE="false"
          if [[ -z "${RELEASED_SEMVER_GIT}" ]]; then
            IS_FIRST_RELEASE="true"
          fi
          {
            echo "released-semver=${RELEASED_SEMVER_GIT:-}"
            echo "next-semver=v${{ steps.gitversion.outputs.semVer }}"
            echo "is-first-release=${IS_FIRST_RELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Build Changelog
        id: changelog
        if: ${{ github.ref_name == github.event.repository.default_branch && steps.versions.outputs.is-first-release != 'true' }}
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        with:
          configuration: changelog-configuration.json
          # `fromTag` is the git tag of the PREVIOUS semver release (computed
          # from `git tag -l` in the Versions step). On the first-ever release
          # this is empty — the action treats an empty fromTag as "no lower
          # bound" and falls back to the config's `empty_template` when no
          # PRs are found. Using the git tag (not the GitHub release tag)
          # works even before the first `gh release create` succeeds.
          fromTag: ${{ steps.versions.outputs.released-semver }}
          toTag: ${{ steps.versions.outputs.next-semver }}
          # Include pre-releases in the changelog range. Pre-release
          # entries (e.g. v1.2.3-beta.1) count as "released" for the
          # purpose of computing the diff from the previous release.
          ignorePreReleases: "false"
          # HYBRID mode: fetch merged PRs for their rich metadata
          # (number, title, labels, author) AND include raw commits
          # between tags that didn't land via PR. Matters for this
          # repo because historical commits on main include direct
          # pushes the default PR mode misses entirely — see run
          # 24697992060, which emitted "No pull requests found"
          # against a range of 8 real commits. With HYBRID, those
          # commits appear as entries via their commit title (the
          # same `label_extractor` regexes apply: feat:, fix:, chore:,
          # test:, docs:, deps:), while future PR merges still get
          # their PR-link template applied. Per upstream docs:
          # "Hybrid mode treats commits like pull requests" —
          # acceptable for this repo because we control the template
          # and category mapping via changelog-configuration.json.
          mode: "HYBRID"
          # Use the GitHub App token (same identity that creates the
          # release) so the action's PR lookups inherit the App's
          # pulls:read permission and rate limit.
          token: ${{ github.token }}
          # Write the rendered changelog to a file at the repo root
          # (relative to the checkout dir, per the action's docs).
          # The Release step consumes it via `gh release create -F <file>`
          # rather than piping through a multi-line env var — avoids
          # both shell-escaping gotchas with the 4 KB+ markdown body
          # AND GitHub Actions' 1 MB limit on `outputs.*` values when
          # the changelog grows large. File is .gitignore'd.
          outputFile: RELEASE_NOTES.md
          # Keep failing on resolution errors (malformed config,
          # unreachable tags, etc.) — the first-release empty-range
          # case is handled by the config's empty_template, not by
          # swallowing errors here.
          failOnError: true

      - name: Generate First Release Notes
        id: first-release-notes
        if: ${{ github.ref_name == github.event.repository.default_branch && steps.versions.outputs.is-first-release == 'true' }}
        run: |
          # For the very first release, there's no previous tag to diff
          # against. The changelog action would auto-detect the initial
          # commit and compare it to itself (same SHA), causing a 404.
          # Instead, write the configured empty_template directly.
          echo "No changes in this release" > RELEASE_NOTES.md

      - name: Find Associated PR
        id: find-pr
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          PR_NUMBER=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER=$(gh pr list \
              --head "${{ github.ref_name }}" \
              --state open \
              --json number \
              --jq '.[0].number // empty')
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Add PR Comment With Tag Link
        if: ${{ steps.find-pr.outputs.number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const semVer = `v${{ steps.gitversion.outputs.semVer }}`;
            const major = `${{ steps.gitversion.outputs.Major }}`;
            const minor = `${{ steps.gitversion.outputs.Minor }}`;
            const patch = `${{ steps.gitversion.outputs.Patch }}`;
            const shortSha = `${{ steps.gitversion.outputs.ShortSha }}`;
            const branch = `${{ steps.working-branch.outputs.branch }}`;
            const tagUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/${semVer}`;

            const actor = `${{ github.actor }}`;
            const actorUrl = `${context.serverUrl}/${actor}`;
            const sender = `${{ github.event.pull_request.head.user.login || github.event.sender.login }}`;
            const senderUrl = `${context.serverUrl}/${sender}`;

            const body = [
              `## 🏷️ Pre-release Tag Created`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Tag** | [\`${semVer}\`](${tagUrl}) |`,
              `| **Version** | \`${major}.${minor}.${patch}\` |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${shortSha}\` |`,
              `| **Actor** | [@${actor}](${actorUrl}) |`,
              `| **Author** | [@${sender}](${senderUrl}) |`,
              ``,
              `> 📦 To test the Rust Toolchain action from this PR:`,
              `> \`\`\`yaml`,
              `> - uses: ${context.repo.owner}/${context.repo.repo}@${semVer}`,
              `> \`\`\``,
            ].join('\n');

            const issueNumber = ${{ steps.find-pr.outputs.number }};
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments
              .filter(c => c.user?.type === 'Bot'
                && c.body?.includes('## 🏷️ Pre-release Tag Created'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const dup of existing.slice(1)) {
              await github.rest.issues.deleteComment({
                comment_id: dup.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            }

            if (existing.length > 0) {
              await github.rest.issues.updateComment({
                comment_id: existing[0].id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Create GitHub Release
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          # Clean up draft releases
          gh release list \
            --json tagName,isDraft \
            -q '.[] | select(.isDraft) | .tagName' \
            | while read -r draft; do
            echo "Removing Draft Release: ${draft}"
            gh release delete --yes "${draft}"
          done

          # Create release targeting the working branch
          gh release create "v${{ steps.gitversion.outputs.semVer }}" \
            --target "${{ steps.working-branch.outputs.branch }}" \
            --generate-notes \
            --verify-tag \
            --latest
