name: CICD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Resolve the version and run every check, but create no tag, release or docs deployment"
        required: false
        type: boolean
        # DEFAULTS TO TRUE, unlike most boolean inputs. Until the Release job
        # admitted workflow_dispatch it was push-only, so this input reached
        # nothing and its default was inert either way. It is live now: with
        # `false`, clicking "Run workflow" on main cuts a real release, deletes
        # and re-pushes four tags and publishes the site. Defaulting to a dry
        # run makes the destructive path the one you opt into. Releases still
        # happen automatically on every push to main, which is the normal route
        # -- a manual dispatch is for previewing what one would do.
        default: true

permissions: read-all

concurrency:
  group: cicd-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  # ──────────────────────────────────────────────
  #  1.  Setup — shared bootstrap for all jobs
  # ──────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    # Resolved here, once, because a job-level `if:` cannot read the `env`
    # context -- only `github`, `needs`, `inputs` and `vars`. Every job that
    # gates on the dry run therefore lists `setup` in its OWN `needs`, even
    # when it already depends on it transitively: `needs.<job>.outputs` is
    # readable only from jobs named directly in `needs`, and an undefined
    # output reads as the empty string rather than erroring.
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      # `inputs` exists only on workflow_dispatch and workflow_call. On a push
      # it is null, so a bare `!inputs.dry-run` evaluates to `!null` -- which is
      # TRUE, and reads as "not a dry run" purely by accident. Guarding on the
      # event name first makes the push case explicit rather than lucky.
      #
      # `A && B || false` rather than `A && B`: an expression whose `&&` short
      # circuits yields the falsy operand itself, so on a push this would emit
      # the empty string. Consumers compare against the literal 'true', so the
      # empty string is still correct -- but 'false' is what the log should say.
      - name: Resolve Run Mode
        id: mode
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) || false }}
        run: |
          set -Eeuo pipefail
          echo "dry-run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run: the version will be resolved and every check will run, but no tag, release or docs deployment will be created."
          fi

  # ──────────────────────────────────────────────
  #  1b. Version — the single source of truth
  # ──────────────────────────────────────────────
  # The ONLY GitVersion invocation in this repository. The Release job below
  # reads `needs.version.outputs.*` rather than running the tool a second time:
  # two derivations from the same history agree until they do not, and the
  # disagreement surfaces as a release tagged one number and announced as
  # another. `version.yml` also applies the rule that a tag ref outranks the
  # derivation, so that decision is made once for every consumer.
  version:
    name: Version
    needs: [setup]
    # A called workflow cannot request more than the calling job grants, and
    # `version.yml` asks for `contents: read`. Stated here rather than inherited
    # from the workflow-level `read-all` so the grant travels with the call.
    permissions:
      contents: read
    uses: ./.github/workflows/version.yml

  # ──────────────────────────────────────────────
  #  2.  Lint — HK project lints
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    needs: [setup]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run HK Lints
        run: hk check --all

  # ──────────────────────────────────────────────
  #  3a. Test
  # ──────────────────────────────────────────────
  test:
    name: Test
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run Tests
        run: bun run test:coverage

  # ──────────────────────────────────────────────
  #  3b. SAST — CodeQL static analysis
  # ──────────────────────────────────────────────
  sast:
    name: SAST
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

  # ──────────────────────────────────────────────
  #  4.  Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    needs: [test, sast]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Build
        shell: bash -l {0}
        run: |
          set -eo pipefail

          echo "::group::Building"
          bun run build
          echo "::endgroup::"

      - name: Assert dist is up-to-date
        shell: bash -l {0}
        run: |
          set -eo pipefail

          echo "::group::Git Diff"
          if ! git diff --exit-code --quiet dist/; then
            echo "::error::dist/index.js is stale — run 'bun run build' locally and commit the result"
            git diff dist/
            exit 1
          fi
          echo "::endgroup::"

  # ──────────────────────────────────────────────
  #  5.  E2E — run the action itself, on real runners
  # ──────────────────────────────────────────────
  #
  # The unit tests exercise `run()` behind injected dependencies, so nothing
  # in CI ever parsed `action.yml` as action metadata or resolved an output
  # expression. A literal `${{ … }}` in an input description once shipped to
  # main because of that: it is opaque prose to YAML, rumdl, Prettier,
  # actionlint and hk alike, and only a runner loading the metadata rejects
  # it. This job is that runner.
  e2e:
    name: E2E
    needs: [build]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Write rust-toolchain.toml
        shell: bash
        run: |
          set -eo pipefail

          cat > rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "1.90"
          profile = "minimal"
          components = ["clippy"]
          EOF
          cat rust-toolchain.toml

      # No `with:` beyond the cache inputs on purpose — this asserts the
      # TOML-first contract, which is the action's headline behaviour.
      #
      # `cache-workspaces` points at the probe crate created below rather than
      # at the repository root. This repository has no Rust crate, so the
      # default `. -> target` names a directory that never exists — which is
      # how an exclusion assertion here stayed vacuous through eight reviews.
      - name: Run Rust Toolchain And Cache
        id: rust-toolchain
        uses: ./
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('bun.lock') }}
          cache-key-suffix: ci
          cache-workspaces: e2e-probe -> e2e-probe/target
          # Pinned, so crates.io is never consulted and a registry outage
          # cannot redden CI. hexyl is chosen because its binary is named after
          # its crate, which is what `ensureTools`' `<name> --version` probe
          # assumes; a crate shipping a differently-named binary (ripgrep ships
          # `rg`) fails that probe and reinstalls on every run.
          cargo-tools: hexyl@0.17.0

      # Values arrive through env rather than interpolated into the script, so
      # an output containing shell metacharacters cannot execute.
      - name: Verify Resolved Outputs
        shell: bash
        env:
          NAME: ${{ steps.rust-toolchain.outputs.name }}
          TOOLCHAIN: ${{ steps.rust-toolchain.outputs.toolchain }}
          PROFILE: ${{ steps.rust-toolchain.outputs.profile }}
          COMPONENTS: ${{ steps.rust-toolchain.outputs.components }}
          CACHEKEY: ${{ steps.rust-toolchain.outputs.cachekey }}
          CACHEKEY_FULL: ${{ steps.rust-toolchain.outputs.cachekey-full }}
        run: |
          set -eo pipefail

          printf 'name=%s toolchain=%s profile=%s components=%s\n' \
            "$NAME" "$TOOLCHAIN" "$PROFILE" "$COMPONENTS"
          printf 'cachekey=%s cachekey-full=%s\n' "$CACHEKEY" "$CACHEKEY_FULL"

          # The toml is the only configuration source here, so every value
          # below proves it was read, parsed and applied.
          [[ "$NAME" == "1.90" ]]      || { echo "::error::name is '$NAME', expected 1.90 from the toml"; exit 1; }
          [[ "$TOOLCHAIN" == "$NAME" ]] || { echo "::error::toolchain and name disagree"; exit 1; }
          [[ "$PROFILE" == "minimal" ]] || { echo "::error::profile is '$PROFILE', expected minimal from the toml"; exit 1; }
          [[ "$COMPONENTS" == *clippy* ]] || { echo "::error::components '$COMPONENTS' lost the toml's clippy"; exit 1; }
          [[ ${#CACHEKEY} -eq 12 ]]     || { echo "::error::cachekey '$CACHEKEY' is not 12 chars"; exit 1; }
          [[ "$CACHEKEY_FULL" == "$CACHEKEY"-* ]] || { echo "::error::cachekey-full does not extend cachekey"; exit 1; }

      - name: Verify The Cargo Tool Was Installed
        shell: bash
        env:
          CARGO_TOOLS: ${{ steps.rust-toolchain.outputs.cargo-tools }}
        run: |
          set -eo pipefail

          echo "cargo-tools output: $CARGO_TOOLS"

          # The output is a JSON array of concrete `name@version`, never
          # `latest` — a resolved set is the whole contract, and it is also
          # what the bin key was hashed from.
          [[ "$CARGO_TOOLS" == '["hexyl@0.17.0"]' ]] \
            || { echo "::error::cargo-tools output is '$CARGO_TOOLS', expected [\"hexyl@0.17.0\"]"; exit 1; }

          command -v hexyl >/dev/null 2>&1 \
            || { echo "::error::hexyl is not on PATH, so the action installed it somewhere later steps cannot reach"; exit 1; }

          version="$(hexyl --version)"
          echo "hexyl reports: $version"
          [[ "$version" == *0.17.0* ]] \
            || { echo "::error::hexyl reports '$version', expected 0.17.0"; exit 1; }

      # Also the only place the README's restore-keys recipe is evaluated by a
      # real runner. Its block scalar must keep both lines at identical
      # indentation, or the join separator gains leading spaces.
      - name: Verify Cache Output
        shell: bash
        env:
          CACHE_JSON: ${{ steps.rust-toolchain.outputs.cache }}
          REGISTRY_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.registry.key }}
          BUILD_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.build.key }}
          CACHEKEY_FULL: ${{ steps.rust-toolchain.outputs.cachekey-full }}
          REGISTRY_RESTORE_KEYS: |
            ${{ join(fromJSON(steps.rust-toolchain.outputs.cache).layers.registry.restoreKeys, '
            ') }}
        run: |
          set -eo pipefail

          echo "cache: $CACHE_JSON"
          echo "registry key: $REGISTRY_KEY"
          echo "build key: $BUILD_KEY"
          echo "registry restore-keys:"
          echo "$REGISTRY_RESTORE_KEYS"

          [[ -n "$REGISTRY_KEY" ]] || { echo "::error::registry cache key is empty"; exit 1; }
          [[ -n "$BUILD_KEY" ]]    || { echo "::error::build cache key is empty"; exit 1; }

          # The layer invariants, asserted rather than assumed: the registry
          # key must not carry the toolchain digest, and the build key must.
          [[ "$REGISTRY_KEY" != *"$CACHEKEY_FULL"* ]] \
            || { echo "::error::registry key carries the toolchain digest; a rustc bump would re-download every crate"; exit 1; }
          [[ "$BUILD_KEY" == *"$CACHEKEY_FULL"* ]] \
            || { echo "::error::build key lacks the toolchain digest; it would restore artifacts cargo discards"; exit 1; }

          # The widest rung is the bare layer-os-arch prefix, and `-x` demands
          # a whole-line match — a re-indented block scalar would prepend
          # spaces and fail here.
          grep -qx "registry-${RUNNER_OS}-${RUNNER_ARCH}-" <<<"$REGISTRY_RESTORE_KEYS" \
            || { echo "::error::join() did not produce one restore key per line"; exit 1; }

      - name: Verify The Toolchain Actually Works
        shell: bash
        env:
          NAME: ${{ steps.rust-toolchain.outputs.name }}
        run: |
          set -eo pipefail

          rustc --version
          cargo --version
          cargo clippy --version

          # RUSTUP_TOOLCHAIN is what makes the resolved channel win in later
          # steps; this step is a later step, so it is the real assertion.
          [[ -n "${RUSTUP_TOOLCHAIN:-}" ]] || { echo "::error::RUSTUP_TOOLCHAIN was not exported"; exit 1; }
          [[ "$RUSTUP_TOOLCHAIN" == "$NAME" ]] \
            || { echo "::error::RUSTUP_TOOLCHAIN is '$RUSTUP_TOOLCHAIN', expected '$NAME'"; exit 1; }
          rustc --version | grep -q "1\.90" \
            || { echo "::error::rustc is not the 1.90 the toml asked for"; exit 1; }

      # A real crate, so there is a real `target/` for the post step to save.
      # Without one the build layer resolves to nothing, `saveCache` refuses an
      # empty path set, and the whole save path is never executed — which is
      # how the negation globs shipped excluding nothing.
      #
      # `cfg-if` is deliberate, not decoration: it is tiny and dependency-free,
      # and downloading it is what populates `$CARGO_HOME/registry`, without
      # which the registry layer has nothing to save either.
      #
      # CARGO_INCREMENTAL=1 overrides the `0` the action exports into
      # GITHUB_ENV (a step's own `env:` wins), so `incremental/` actually
      # exists to be excluded. The build key is unaffected: CARGO_INCREMENTAL
      # is on `hashBuildEnv`'s deny-list precisely because the action sets it
      # itself. `--examples` gives the other exclusion something to bite on.
      - name: Build A Probe Crate
        shell: bash
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -eo pipefail

          mkdir -p e2e-probe/src e2e-probe/examples
          cat > e2e-probe/Cargo.toml <<'EOF'
          [package]
          name = "e2e-probe"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          cfg-if = "1"
          # Built here and REMOVED before the post step saves, so its artifacts
          # are provably on disk and provably stale. That ordering is the whole
          # assertion: `E2E Warm Cache` can then require them absent from the
          # restored tree, which proves the keep-set dropped them rather than
          # them never having existed. Asserting absence without building it
          # first would pass on a cache that pruned nothing at all.
          itoa = "1"
          EOF
          # Deliberately does not reference cfg-if. `cfg_if!` is an item macro,
          # not an expression one, so the obvious one-liner does not compile —
          # and cargo builds a declared dependency whether or not it is used,
          # which is all this needs it for.
          echo 'fn main() { println!("e2e probe"); }' > e2e-probe/src/main.rs
          echo 'fn main() { println!("hello"); }' > e2e-probe/examples/hello.rs

          cargo build --manifest-path e2e-probe/Cargo.toml --bins --examples

          # The exclusion assertion in the warm job is only meaningful if the
          # things it looks for exist here first. Fail loudly rather than
          # leaving that job asserting on something that can never be present.
          find e2e-probe/target -type d -name incremental | grep -q . \
            || { echo "::error::no incremental/ was produced, so the exclusion assertion downstream would be vacuous"; exit 1; }
          find e2e-probe/target -type d -name examples | grep -q . \
            || { echo "::error::no examples/ was produced, so the exclusion assertion downstream would be vacuous"; exit 1; }

      # A second invocation in the same job. It cannot observe a hit on
      # anything this job saves — `post:` runs only after every other step in
      # the job finishes — so the warm-restore proof lives in the separate
      # `E2E Warm Cache` job below, which `needs:` this one.
      #
      # What this invocation does prove is that the derived keys do not move
      # between two invocations. They did: the action exports CARGO_INCREMENTAL
      # and friends through GITHUB_ENV, so the second invocation used to read
      # its own predecessor's output back as caller-supplied environment and
      # derive a different `envHash` — e3b0c442 then dd704211 — and therefore a
      # `build` key nothing would ever restore.
      #
      # The suffix differs on purpose. With an identical suffix both
      # invocations' post steps race to save the `registry` layer under the
      # same key, one loses, and every CI run across three operating systems
      # emits a warning that means nothing — which is how a warning channel
      # stops being read.
      - name: Run Rust Toolchain And Cache Again (Same Job, Different Suffix)
        id: rust-toolchain-second
        uses: ./
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('bun.lock') }}
          cache-key-suffix: ci-second
          cache-workspaces: e2e-probe -> e2e-probe/target
          # `bin` is left out here, and the suffix is why it has to be. The bin
          # key deliberately carries no suffix — two jobs resolving the same
          # tool set need byte-identical binaries, so splitting them apart
          # would cost sharing and buy nothing — which means two invocations in
          # ONE job derive the same bin key no matter how their suffixes
          # differ, and their post steps would race to save it. That is the
          # same warning-for-nothing this step's suffix exists to avoid for
          # `registry`, and the only fix available at the workflow level is to
          # not enable the layer twice. Scoping it here also exercises
          # `cache-layers` on a real runner.
          cache-layers: registry,build

      - name: Verify The Keys Do Not Move Between Invocations
        shell: bash
        env:
          FIRST_BUILD_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.build.key }}
          SECOND_BUILD_KEY: ${{ fromJSON(steps.rust-toolchain-second.outputs.cache).layers.build.key }}
          FIRST_REGISTRY_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.registry.key }}
          SECOND_REGISTRY_KEY: ${{ fromJSON(steps.rust-toolchain-second.outputs.cache).layers.registry.key }}
        run: |
          set -eo pipefail

          echo "first  build key: $FIRST_BUILD_KEY"
          echo "second build key: $SECOND_BUILD_KEY"
          echo "first  registry key: $FIRST_REGISTRY_KEY"
          echo "second registry key: $SECOND_REGISTRY_KEY"

          # The two invocations differ in exactly one input, so their keys must
          # differ in exactly one segment. Anything else means a segment moved
          # on its own — and the only segment that can is `envHash`, which the
          # action's own GITHUB_ENV exports used to shift.
          [[ "${FIRST_BUILD_KEY/-ci-/-ci-second-}" == "$SECOND_BUILD_KEY" ]] \
            || { echo "::error::the build key changed by more than the suffix between two same-job invocations; envHash is not stable across the action's own exports"; exit 1; }
          [[ "${FIRST_REGISTRY_KEY/-ci-/-ci-second-}" == "$SECOND_REGISTRY_KEY" ]] \
            || { echo "::error::the registry key changed by more than the suffix between two same-job invocations"; exit 1; }

      # Plants the evidence `E2E Warm Cache` reads back. Last step in the job
      # on purpose: `post:` runs after every regular step, so whatever is on
      # disk here is what the bin layer archives.
      #
      # Two pieces, because the layer has two things to prove and neither
      # proves the other.
      #
      # The sentinel is an ordinary file in the same directory as the tool. It
      # is not a shim, so `binPaths`' negations must not touch it and the
      # archive must carry it. Its return in the warm job is what says the
      # archive round-tripped at all.
      #
      # The decoy is the mirror image: a file at a path the negations name
      # exactly, which therefore must NOT come back. It REPLACES the shim
      # rather than appending to it, and both halves of that matter. rustup
      # hardlinks all of its shims to one inode, so appending to `rust-gdbgui`
      # would also rewrite `cargo`, `rustc` and `rustup` itself; and on macOS
      # arm64 every executable needs a valid signature, which appending to a
      # Mach-O invalidates. Replacing sidesteps both: unlinking one hardlink
      # leaves the others intact, and a plain text file has no signature to
      # break. `rust-gdbgui` is the target because nothing in this workflow
      # runs it. `rm -f` before writing means this works whether or not the
      # shim was there to begin with.
      # Removes a dependency whose artifacts were just built. `cargo metadata`
      # in the post step then resolves a package set without it, so the keep-set
      # must drop every itoa-* artifact while keeping the cfg-if ones. Both
      # halves matter: an assertion that only checked for absence would also
      # pass if pruning had dropped everything.
      - name: Drop A Dependency After Building It
        shell: bash
        run: |
          set -eo pipefail

          echo "itoa artifacts present before pruning:"
          find e2e-probe/target -name 'libitoa-*' -o -name 'itoa-*' | head -5
          find e2e-probe/target -name 'libitoa-*' | grep -q . \
            || { echo "::error::itoa was never built, so the pruning assertion would be vacuous"; exit 1; }

          python3 - <<'PY'
          import re
          p = "e2e-probe/Cargo.toml"
          s = open(p).read()
          open(p, "w").write(re.sub(r'itoa = "1"\n', "", s))
          PY
          cat e2e-probe/Cargo.toml

      - name: Plant Bin-Layer Evidence
        shell: bash
        run: |
          set -eo pipefail

          bin="${CARGO_HOME:-$HOME/.cargo}/bin"

          printf 'E2E_BIN_SENTINEL' > "$bin/e2e-bin-sentinel"

          for decoy in rust-gdbgui rust-gdbgui.exe; do
            rm -f "$bin/$decoy"
            printf 'SHIM_DECOY_MUST_NOT_BE_ARCHIVED' > "$bin/$decoy"
          done

          echo "planted the sentinel and the shim decoys in $bin"

  # ──────────────────────────────────────────────
  #  5b. E2E Warm Cache — the only proof the save path works
  # ──────────────────────────────────────────────
  #
  # `needs: [e2e]`, and that is the entire point. A job's `post:` steps run
  # after every other step in that job, so no invocation inside `e2e` can ever
  # observe an entry `e2e` itself saved. A dependent job can: it does not start
  # until `e2e` has fully completed, post steps included.
  #
  # Until this job existed, `saveCache`, the manifest, the negation patterns
  # and tar had never run successfully anywhere — which is how a `buildPaths`
  # that excluded nothing survived eight reviews. The two assertions below are
  # the only end-to-end evidence that the save half of the lifecycle works at
  # all.
  e2e-warm:
    name: E2E Warm Cache
    needs: [e2e]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      # Byte-identical to the E2E job's, because the toolchain it resolves
      # feeds `cachekey-full`, which is a segment of the build key. A different
      # channel here would derive a different key and miss by construction.
      - name: Write rust-toolchain.toml
        shell: bash
        run: |
          set -eo pipefail

          cat > rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "1.90"
          profile = "minimal"
          components = ["clippy"]
          EOF

      # Same suffix, same lock hash, same workspace mapping as the E2E job's
      # first invocation — so this restores exactly what that job's post step
      # saved. The probe crate is deliberately *not* recreated: restoring is
      # what has to put `e2e-probe/target` on disk, and building it first would
      # let a broken restore pass unnoticed.
      - name: Restore The Cache Saved By The Previous Job
        id: rust-toolchain
        uses: ./
        with:
          cache: true
          cache-key-hash: ${{ hashFiles('bun.lock') }}
          cache-key-suffix: ci
          cache-workspaces: e2e-probe -> e2e-probe/target
          # Must match the previous job's exactly. The bin key is a digest of
          # the resolved tool set, so omitting this would derive the empty-set
          # key, miss by construction, and fail the `cache-hit` assertion below
          # for a reason that has nothing to do with the save path.
          cargo-tools: hexyl@0.17.0

      - name: Verify The Warm Restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-toolchain.outputs.cache-hit }}
          CACHE_JSON: ${{ steps.rust-toolchain.outputs.cache }}
        run: |
          set -eo pipefail

          echo "cache-hit: $CACHE_HIT"
          echo "cache: $CACHE_JSON"

          # The previous job saved both layers, so both must match exactly.
          # Anything less means the save path failed somewhere the warnings
          # were not read.
          [[ "$CACHE_HIT" == "true" ]] \
            || { echo "::error::cache-hit is '$CACHE_HIT'; the previous job's post step did not save both layers under the keys this job derives"; exit 1; }

          [[ -d e2e-probe/target ]] \
            || { echo "::error::the build layer restored no target directory"; exit 1; }
          # `|| true` because `set -o pipefail` is on: once the tree is large
          # enough, `head` closes the pipe first, `find` dies on SIGPIPE, and
          # the step fails on a diagnostic that was never load-bearing.
          find e2e-probe/target -type f | head -20 || true

      # The assertion the whole exclusion mechanism exists for, and the one
      # that would have caught its being a no-op. Both directories provably
      # existed when the previous job saved — that job fails if they do not —
      # so their absence here is the exclusion working rather than an artefact
      # of nothing having been built.
      - name: Verify The Exclusions Reached The Archive
        shell: bash
        run: |
          set -eo pipefail

          if find e2e-probe/target -type d -name incremental | grep -q .; then
            echo "::error::an incremental directory survived into the restored cache; the negation globs excluded nothing"
            find e2e-probe/target -type d -name incremental
            exit 1
          fi
          if find e2e-probe/target -type d -name examples | grep -q .; then
            echo "::error::an examples directory survived into the restored cache; the negation globs excluded nothing"
            find e2e-probe/target -type d -name examples
            exit 1
          fi
          echo "no incremental/ or examples/ under the restored target dir"

      # The only assertion in the repository that can prove the shim exclusion
      # reached a real GitHub cache archive, on all three operating systems.
      # `act-cache.yml` proves it locally by listing the stored tar; nothing
      # here can, because the cache API exposes no such listing — so the proof
      # has to be carried by files planted in the previous job.
      #
      # Note what a bare `test ! -f "$bin/rust-gdbgui"` would establish:
      # nothing. Every shim is on disk here regardless, because this job's own
      # rustup put them there. Only the decoy's CONTENT distinguishes "restored
      # from an archive that wrongly contained it" from "recreated by rustup",
      # which is why the previous job replaced the shim with a marked plain
      # file rather than merely noting its existence.
      # Phase D's acceptance criterion. Both halves are required, and the
      # second is what stops it being vacuous: cfg-if stayed in Cargo.toml so
      # its artifacts MUST come back, while itoa was built and then removed so
      # its artifacts must not. Asserting only the absence would pass on an
      # archive that pruned everything, on a stale archive saved before itoa
      # existed, and on a build layer that missed entirely.
      - name: Verify Pruning Dropped The Removed Dependency
        shell: bash
        env:
          BUILD_RESULT: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.build.result }}
        run: |
          set -eo pipefail

          echo "build layer result: $BUILD_RESULT"
          if [[ "$BUILD_RESULT" == "miss" ]]; then
            echo "::error::the build layer restored nothing, so this assertion would be vacuous"
            exit 1
          fi

          # The keep half. Without it, an archive that dropped everything --
          # or one saved before itoa was ever built -- would pass below.
          if ! find e2e-probe/target -name 'libcfg_if-*' | grep -q .; then
            echo "::error::cfg-if artifacts are absent from the restored tree, so the keep-set dropped a dependency the workspace still resolves to"
            find e2e-probe/target -type f | head -20
            exit 1
          fi
          echo "kept: $(find e2e-probe/target -name 'libcfg_if-*' | head -3)"

          # The drop half.
          if find e2e-probe/target -name 'libitoa-*' | grep -q .; then
            echo "::error::itoa artifacts survived into the restored cache; the keep-set did not drop a package cargo metadata no longer resolves"
            find e2e-probe/target -name 'libitoa-*'
            exit 1
          fi

          echo "pruning verified: cfg-if round-tripped, the removed itoa did not"

      - name: Verify The Shims Stayed Out Of The Archive
        shell: bash
        run: |
          set -eo pipefail

          bin="${CARGO_HOME:-$HOME/.cargo}/bin"

          # Guard first. Every assertion below is vacuous if the layer never
          # restored, and a silent vacuous pass is the failure mode this whole
          # step exists to rule out.
          grep -qa E2E_BIN_SENTINEL "$bin/e2e-bin-sentinel" 2>/dev/null || {
            echo "::error::the bin layer did not restore the sentinel planted by the E2E job, so nothing below would be proved"
            exit 1
          }

          command -v hexyl >/dev/null 2>&1 \
            || { echo "::error::hexyl is absent after a warm restore"; exit 1; }
          hexyl --version

          # Any shim carrying the decoy came out of the archive, which means
          # the negations in binPaths are inert — the same tar --files-from
          # regression the build layer hit, where a directory left in the
          # manifest re-included everything the negations removed.
          leaked=""
          for shim in cargo cargo-clippy cargo-fmt cargo-miri clippy-driver \
                      rls rust-analyzer rust-gdb rust-gdbgui rust-lldb rustc \
                      rustdoc rustfmt rustup; do
            for candidate in "$bin/$shim" "$bin/$shim.exe"; do
              if grep -qa SHIM_DECOY_MUST_NOT_BE_ARCHIVED "$candidate" 2>/dev/null; then
                leaked="$leaked $candidate"
              fi
            done
          done

          if [[ -n "$leaked" ]]; then
            echo "::error::these shims were restored from the bin cache, so binPaths archived them:$leaked"
            exit 1
          fi

          echo "bin layer verified: the tool and sentinel round-tripped, the shims did not"

  # ──────────────────────────────────────────────
  #  6.  Release — only on push to default branch
  # ──────────────────────────────────────────────
  release:
    name: Release
    # `setup` and `version` are listed even though `build` already depends on
    # both: `needs.<job>.outputs` is readable only from jobs named directly
    # here, and a missing name yields the empty string instead of an error.
    needs: [setup, version, build, e2e, e2e-warm]
    # `workflow_dispatch` is admitted so the dry run has something to exercise.
    # Before, this job was push-only, which meant the `dry-run` input could
    # never reach any job that acts on it -- the guard rail existed as an input
    # and gated nothing anywhere. The irreversible steps below are each guarded
    # on `needs.setup.outputs.dry-run`, so a dispatched run resolves the version,
    # composes the changelog and reports what it WOULD create.
    if: >
      github.ref_name == github.event.repository.default_branch
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      # Read by the guarded steps below. A step-level `if:` can read `needs`,
      # but these are single `run:` blocks whose destructive commands sit
      # partway down -- branching in bash keeps the derivation visible in a dry
      # run, which is the entire point of one.
      DRY_RUN: ${{ needs.setup.outputs.dry-run }}
      # NOT `VERSION`: the Tag step's `tagger()` takes a positional argument by
      # that name, and a job-level env of the same name is what it would shadow.
      RELEASE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      # No GitVersion steps here any more. The `version` job calls
      # `.github/workflows/version.yml`, which is the one place the tool runs;
      # everything below reads `needs.version.outputs.*`. Reinstating a local
      # `gittools/actions` invocation would recreate the split brain that
      # workflow exists to prevent -- and would also drop its tag-authority
      # rule, so a run triggered by a tag would publish the number GitVersion
      # guessed rather than the one the tag names.

      - name: Report Resolved Version
        run: |
          set -Eeuo pipefail
          {
            echo "### Release"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Version** | \`v${RELEASE_VERSION}\` |"
            echo "| **Source** | \`${VERSION_SOURCE}\` |"
            echo "| **Mode** | ${MODE} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved v${RELEASE_VERSION} from ${VERSION_SOURCE} (dry-run=${DRY_RUN})"
        env:
          VERSION_SOURCE: ${{ needs.version.outputs.source }}
          MODE: ${{ needs.setup.outputs.dry-run == 'true' && 'dry run — nothing will be created' || 'release' }}

      - name: Determine Working Branch
        id: working-branch
        shell: bash
        run: |
          set -eo pipefail
          if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]]; then
            WORKING_BRANCH="release/v${{ needs.version.outputs.version }}"
          else
            WORKING_BRANCH="prerelease/v${{ needs.version.outputs.version }}"
          fi
          echo "branch=${WORKING_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Working Branch: ${WORKING_BRANCH}"

      # Was "Skip prerelease versions", and it skipped nothing: `exit 0` ends
      # THAT step successfully, so every later step still ran. It is not fixed
      # by making it skip, because a working version would stop releasing
      # altogether.
      #
      # X.Y.Z-N IS this repository's release format. GitVersion runs
      # ContinuousDelivery with an empty `branches.main.label`, so an untagged
      # commit on main resolves to `X.Y.Z-N` where N is the commit distance --
      # 0.2.1-2 at the time of writing. Every push to main produces one, the Tag
      # step publishes it alongside the rolling v0.2.1, v0.2 and v0 that
      # consumers pin, and it is a full release. A guard that skipped or
      # demoted every X.Y.Z-N would fire on all of them.
      #
      # So the test is NOT "does a prerelease component exist" -- on main one
      # always does. It is whether that component is LABELLED. A numeric-only
      # suffix is the build counter and releases normally; a suffix carrying a
      # label (`-beta.1`, `-rc.2`, `-alpha`) is a genuine prerelease and is
      # marked as one. Those come from the `release` and `feature` branch
      # configs in GitVersion.yml, which set `label: beta` and `{BranchName}`.
      #
      # The field mattered too. GitVersion's own PreReleaseLabel is EMPTY on
      # main (that is the branch config), so the original check could not fire
      # even setting the `exit 0` aside -- the number lives in PreReleaseNumber.
      # Reading through `version.yml` removes the question: it derives
      # preReleaseLabel from the resolved SemVer string, so `0.2.1-2` yields "2"
      # and `0.3.0-beta.1` yields "beta.1".
      - name: Classify Release
        id: classify
        env:
          PRE: ${{ needs.version.outputs.preReleaseLabel }}
        run: |
          set -Eeuo pipefail

          # Numeric-only (or absent) means the build counter, which is a normal
          # release here. Anything containing a non-digit is a labelled
          # prerelease. `${PRE//[0-9.]/}` strips digits and dots; whatever is
          # left is the label, so an empty remainder means there was none.
          if [ -n "${PRE}" ] && [ -n "${PRE//[0-9.]/}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v${RELEASE_VERSION} is a labelled prerelease ('${PRE}'); marking the GitHub Release as a pre-release."
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "v${RELEASE_VERSION} is a release${PRE:+ (build counter ${PRE})}; it will be marked latest."
          fi

      - name: Update Workflow Files With New Version
        id: update-workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          echo "Creating/Updating Working branch: ${{ steps.working-branch.outputs.branch }}"
          git checkout -B "${{ steps.working-branch.outputs.branch }}"

          echo "Updating Workflow files to version v${{ needs.version.outputs.version }}"

          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          NEW_VERSION="v${{ needs.version.outputs.version }}"

          find .github -type f \( -name "*.yml" -o -name "*.yaml" \) ! -name "_release.yml" \
            | while read -r file; do
            sed -i -E "s#(${REPO_OWNER}/${REPO_NAME}/.+)@(main|v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.]+)?)#\1@${NEW_VERSION}#g" "$file"
          done

          git add .github
          git commit -m "chore: Update action references to v${{ needs.version.outputs.version }} [skip ci]" \
            || echo "No changes to commit"

          # The commit above is local to this runner and disappears with it, so
          # only the push is guarded. A dry run still proves the rewrite applied
          # cleanly, which is the part that can actually be wrong.
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run: skipping push of ${{ steps.working-branch.outputs.branch }}"
            git --no-pager show --stat --oneline HEAD
          else
            git push -u origin "${{ steps.working-branch.outputs.branch }}" --force
          fi

      - name: Tag
        id: tag
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Tag Information"
          echo "::group::Tagger Function"
          function tagger() {
            # `local`, not a bare assignment. Without it this writes the
            # runner-wide VERSION, which the job env also defines -- the two
            # would silently fight over one name.
            local VERSION="$1"
            echo "Releasing Version: ${VERSION}"

            # Every branch below deletes or force-pushes something, so the dry
            # run reports the plan and returns before any of it. Reporting the
            # whole ladder is the point: this function is called four times, and
            # what a release actually moves is the set of tags it names here.
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::Dry run: would tag and push ${VERSION}"
              return 0
            fi

            TAG_EXISTS=$(git ls-remote -q --tags | grep -q "refs/tags/${VERSION}$" && echo true || echo false)
            if [[ "${TAG_EXISTS}" = true ]];
            then
              HAS_RELEASE=$(gh release list --json tagName -q '.[].tagName' | grep -E "^(${VERSION})$" && echo true || echo false)
              if [[ "${HAS_RELEASE}" == true ]];
              then
                gh release delete --yes "${VERSION}"
              fi
              git push origin --delete "${VERSION}"
              git tag -d "${VERSION}"
            fi

            echo "::group::Tagging Version ${VERSION}"
            git tag -a "${VERSION}" -m "chore: Release Version ${VERSION}"
            git push -f --tags --follow-tags
            # NOTE: no `git push --set-upstream origin <ref>` here. On
            # pull_request events github.ref_name is the virtual merge
            # ref like 9/merge, which isn't a pushable branch — push
            # fails with "src refspec 9/merge does not match any" and
            # leaks an error into the CI log. Tags are already pushed
            # above via --follow-tags; set-upstream was redundant on
            # main pushes and broken on PR events.
            echo "::endgroup::"
          }
          echo "::endgroup::"

          echo "::group::Tagging Version v${{ needs.version.outputs.version }}"
          tagger "v${{ needs.version.outputs.version }}"
          echo "::endgroup::"

          if [[ "${{ github.ref_name  }}" == "${{ github.event.repository.default_branch }}" && "${{ github.event_name }}" != "pull_request" ]];
          then
            echo "::group::Tagging Version v${{ needs.version.outputs.majorMinorPatch }}"
            tagger "v${{ needs.version.outputs.majorMinorPatch }}"
            echo "::endgroup::"

            echo "::group::Tagging Version v${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
            tagger "v${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
            echo "::endgroup::"

            echo "::group::Tagging Version v${{ needs.version.outputs.major }}"
            tagger "v${{ needs.version.outputs.major }}"
            echo "::endgroup::"
          fi
          echo "::endgroup::"

      # Diagnostics only. This step publishes no outputs and nothing reads it:
      # it exists so a release run's log records what was already published
      # next to what this run is about to publish, which is the fastest way to
      # see that the Tag step moved the floating tags it was meant to.
      - name: Versions
        shell: bash -l {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Latest Released Tags Output"
          # Latest GitHub release — the full-semver entry created by
          # the `gh release create` step on previous runs. `gh release
          # view` (no arg) resolves to the latest release by published
          # date. Exits non-zero when there are no releases yet; the
          # `|| true` fallback keeps the variable empty without failing
          # the step.
          RELEASED_RELEASE_DESC=$(
            gh release view \
              --json tagName,isPrerelease,publishedAt \
              --jq '"\(.tagName) [\(if .isPrerelease then "prerelease" else "stable" end), \(.publishedAt)]"' \
              2>/dev/null || echo "(no releases yet)"
          )
          echo "Latest GitHub release: ${RELEASED_RELEASE_DESC}"

          echo ""
          # Rolling umbrella tags are force-pushed on every release by
          # the Tag step. They exist as git tags WITHOUT corresponding
          # `gh release` entries, so we enumerate them via `git tag -l`
          # + semver-pattern filters. Tags were fetched during Checkout
          # (`fetch-tags: true`).
          echo "Rolling umbrella tags (git-only, no GitHub release):"
          ALL_TAGS=$(git tag -l 'v*' --sort=-v:refname 2>/dev/null || true)
          RELEASED_SEMVER_GIT=$(printf '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$' | head -1)
          RELEASED_MMP=$(printf '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          RELEASED_MM=$(printf  '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+\.[0-9]+$' | head -1)
          RELEASED_M=$(printf   '%s\n' "${ALL_TAGS}" | grep -E '^v[0-9]+$' | head -1)
          echo "  SemVer:          ${RELEASED_SEMVER_GIT:-none}"
          echo "  MajorMinorPatch: ${RELEASED_MMP:-none}"
          echo "  MajorMinor:      ${RELEASED_MM:-none}"
          echo "  Major:           ${RELEASED_M:-none}"
          echo "::endgroup::"

          echo "::group::GitVersion Tags Output"
          LATEST_SEMVER="v${{ needs.version.outputs.version }}"
          LATEST_MMP="v${{ needs.version.outputs.majorMinorPatch }}"
          LATEST_MM="v${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
          LATEST_M="v${{ needs.version.outputs.major }}"

          echo ""
          echo "  SemVer:          ${LATEST_SEMVER:-none}"
          echo "  MajorMinorPatch: ${LATEST_MMP:-none}"
          echo "  MajorMinor:      ${LATEST_MM:-none}"
          echo "  Major:           ${LATEST_M:-none}"
          echo "::endgroup::"

      # No changelog-building step here, deliberately. There was one — a
      # `mikepenz/release-changelog-builder-action` invocation writing
      # `RELEASE_NOTES.md`, plus a first-release fallback writing the same
      # file — and nothing ever read the result: `gh release create` below
      # passes `--generate-notes` and no `-F`. The release notes have always
      # come from GitHub's own generator, categorised by `.github/release.yml`
      # against the labels `labeler.yml` applies.
      #
      # It could not have worked as written either: it passed
      # `configuration: changelog-configuration.json`, a file that does not
      # exist in this repository, with `failOnError: true`.
      #
      # Restoring it means three things together, not one: create that config,
      # add `-F RELEASE_NOTES.md` to `gh release create`, and gitignore the
      # file (the removed comment claimed it was ignored; it was not).

      - name: Find Associated PR
        id: find-pr
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          PR_NUMBER=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER=$(gh pr list \
              --head "${{ github.ref_name }}" \
              --state open \
              --json number \
              --jq '.[0].number // empty')
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Add PR Comment With Tag Link
        if: ${{ steps.find-pr.outputs.number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const semVer = `v${{ needs.version.outputs.version }}`;
            const major = `${{ needs.version.outputs.major }}`;
            const minor = `${{ needs.version.outputs.minor }}`;
            const patch = `${{ needs.version.outputs.patch }}`;
            const shortSha = `${{ needs.version.outputs.shortSha }}`;
            const branch = `${{ steps.working-branch.outputs.branch }}`;
            const tagUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/${semVer}`;

            const actor = `${{ github.actor }}`;
            const actorUrl = `${context.serverUrl}/${actor}`;
            const sender = `${{ github.event.pull_request.head.user.login || github.event.sender.login }}`;
            const senderUrl = `${context.serverUrl}/${sender}`;

            const body = [
              `## 🏷️ Pre-release Tag Created`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Tag** | [\`${semVer}\`](${tagUrl}) |`,
              `| **Version** | \`${major}.${minor}.${patch}\` |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Commit** | \`${shortSha}\` |`,
              `| **Actor** | [@${actor}](${actorUrl}) |`,
              `| **Author** | [@${sender}](${senderUrl}) |`,
              ``,
              `> 📦 To test the Rust Toolchain and Cache action from this PR:`,
              `> \`\`\`yaml`,
              `> - uses: ${context.repo.owner}/${context.repo.repo}@${semVer}`,
              `> \`\`\``,
            ].join('\n');

            const issueNumber = ${{ steps.find-pr.outputs.number }};
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments
              .filter(c => c.user?.type === 'Bot'
                && c.body?.includes('## 🏷️ Pre-release Tag Created'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const dup of existing.slice(1)) {
              await github.rest.issues.deleteComment({
                comment_id: dup.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            }

            if (existing.length > 0) {
              await github.rest.issues.updateComment({
                comment_id: existing[0].id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

      - name: Create GitHub Release
        if: ${{ github.ref_name == github.event.repository.default_branch }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.classify.outputs.prerelease }}
        run: |
          set -eo pipefail

          # `--prerelease` and `--latest` are mutually exclusive, and passing
          # `--latest` unconditionally is what made every X.Y.Z-N build claim to
          # be the newest stable release. GitHub surfaces "Latest" on the
          # repository front page and serves it to `gh release view` with no
          # argument, so the label is the thing consumers actually read.
          if [ "${IS_PRERELEASE}" = "true" ]; then
            RELEASE_FLAG="--prerelease"
          else
            RELEASE_FLAG="--latest"
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run: would create release v${RELEASE_VERSION} ${RELEASE_FLAG} targeting ${{ steps.working-branch.outputs.branch }}"
            exit 0
          fi

          # Clean up draft releases
          gh release list \
            --json tagName,isDraft \
            -q '.[] | select(.isDraft) | .tagName' \
            | while read -r draft; do
            echo "Removing Draft Release: ${draft}"
            gh release delete --yes "${draft}"
          done

          # Create release targeting the working branch
          gh release create "v${RELEASE_VERSION}" \
            --target "${{ steps.working-branch.outputs.branch }}" \
            --generate-notes \
            --verify-tag \
            "${RELEASE_FLAG}"

  # ──────────────────────────────────────────────
  #  7.  Docs — publish the Docusaurus site
  # ──────────────────────────────────────────────
  # A job-level `uses:`, not steps: a step cannot call a workflow. gh-pages.yml
  # owns the build so that one definition serves both entry points -- its own
  # `pull_request` trigger builds the site before merge, and this call builds
  # and publishes it after a release. cicd.yml deliberately builds no docs of
  # its own, so those two paths never overlap.
  gh-pages:
    name: Publish Docs Site
    # All three are named because `needs.<job>.outputs` is readable only from
    # jobs listed here -- depending on them transitively is not enough, and the
    # miss is silent: the output resolves to the empty string. `setup` carries
    # the dry-run mode, `version` the number for the summary, and `release`
    # orders this after the tag exists so the site never cites a version that
    # failed to ship.
    needs: [setup, version, release]
    if: >
      success()
      && github.ref_name == github.event.repository.default_branch
    # A called workflow cannot request more than the calling job grants, so
    # these mirror gh-pages.yml's `publish` job exactly. `pages:`/`id-token:`
    # are the Pages ARTIFACT deployment path: `deploy-pages` mints an OIDC
    # token to prove to the Pages service which run produced the artifact.
    #
    # `contents` drops from write to read. Publishing used to commit the built
    # site onto a `gh-pages` branch; an artifact deployment writes nothing to
    # the repository, so the release path no longer needs push access at all.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/gh-pages.yml
    secrets: inherit
    with:
      # THE dry-run guard for the docs. Compared against the string 'true'
      # rather than negated: the previous form was `!inputs.dry-run`, and on a
      # push `inputs` is null, so it evaluated `!null` -- true by accident
      # rather than intent, and true even on a dispatched dry run.
      #
      # Required, not optional: gh-pages.yml's `publish` job gates on
      # `inputs.publish` and defaults it to false, so calling without this
      # builds the site and deploys nothing.
      publish: ${{ needs.setup.outputs.dry-run != 'true' }}
      version: ${{ needs.version.outputs.version }}
