name: GitHub Pages Docs

# A LITERAL name, not `${{ github.workflow }}`. In a called workflow that
# expression resolves to the CALLER's name, so this rendered as `CI-main` -- the
# same group cicd.yml holds -- and the call deadlocked against its own caller:
# "Canceling since a deadlock was detected for concurrency group: 'CI-main'
# between a top level workflow and 'Publish'". A fixed prefix cannot collide with
# the caller's group however this workflow is reached.
concurrency:
  group: gh-pages-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# The Docusaurus site under `docs/`. Built on every change so a broken site is
# caught in review; published only from `main`.
#
# A workflow of its own rather than a job in cicd.yml: a broken docs build must
# not fail the action's gate. It compiles nothing, so it also skips the toolchain
# setup every other job in cicd.yml pays for.
#
# Published through the Pages ARTIFACT source (`build_type: workflow`), not by
# committing to a `gh-pages` branch. A repository serves Pages from exactly one
# source, so the two are alternatives rather than a belt-and-braces pair.
#
# No `push` trigger: cicd.yml's `gh-pages` job calls this workflow after Release,
# so a push to main would publish the site here AND again through that call --
# and between the two the site could sit ahead of the released version.
#
# `pull_request` stays, and only builds: `publish` below requires
# `inputs.publish`, which a pull request cannot set. It is the one cheap check
# that the site still compiles BEFORE merge, and it does not overlap cicd.yml,
# which builds no docs of its own.
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy the built site to GitHub Pages, not just build it"
        type: boolean
        default: false
      version:
        # A version STRING (e.g. `0.1.2`), not a boolean -- the description and
        # type were both copied from `publish` above, so a boolean input was
        # being handed a version string. cicd.yml passes
        # `needs.version.outputs.version`, which `version.yml` resolved.
        #
        # Optional and defaulting to EMPTY: it is cited in the job summary only,
        # so requiring it would mean inventing a version just to dispatch a docs
        # build by hand. The summary omits the version and release rows when it
        # is blank rather than printing a bare `v` and a 404 link.
        description: "Version to cite in the published-site summary (e.g. 0.1.2)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      publish:
        description: "Deploy the built site to GitHub Pages, not just build it"
        type: boolean
        default: false
      version:
        # A version STRING (e.g. `0.1.2`), not a boolean -- the description and
        # type were both copied from `publish` above, so a boolean input was
        # being handed a version string. cicd.yml passes
        # `needs.version.outputs.version`, which `version.yml` resolved.
        #
        # Optional and defaulting to EMPTY: it is cited in the job summary only,
        # so requiring it would mean inventing a version just to dispatch a docs
        # build by hand. The summary omits the version and release rows when it
        # is blank rather than printing a bare `v` and a 404 link.
        description: "Version to cite in the published-site summary (e.g. 0.1.2)"
        type: string
        required: false
        default: ""

# NOT `read-all`. This workflow is called (cicd.yml's `gh-pages` job calls it),
# and a called workflow cannot request more than the calling JOB grants. `read-all`
# expands to read on every scope there is -- attestations, discussions, models,
# packages, statuses and a dozen more -- so the call failed with "The workflow is
# requesting 'artifact-metadata: read, attestations: read, ...' but is only
# allowed". Every job that needs more than this declares it itself.
permissions:
  contents: read

env:
  # mise is here for its task definitions, not for provisioning: bun comes from
  # setup-bun, and installing the workspace's Rust tools would cost minutes in a
  # job that never touches a crate.
  MISE_TASK_RUN_AUTO_INSTALL: false

jobs:
  build:
    name: Build site
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # ONE checkout, carrying the `ref:` from the start. There were two, neither
      # guarded, so both always ran: a full recursive clone at the default ref,
      # then a second one at the PR head sha that overwrote it. The first existed
      # only because `./.github/actions/bot-setup` below is a LOCAL action and
      # cannot resolve before the repository is on disk -- which a single
      # correctly-reffed checkout satisfies just as well.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: GitHub Actions Bot Configuration
        uses: ./.github/actions/bot-setup

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Resolved from the repo root: this step sets no working-directory,
          # so the path has to be spelled out. The pin lives beside the
          # `package.json` it belongs to, under `docs/`.
          bun-version-file: "docs/.bun-version"

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false

      # `docusaurus build` transpiles without type-checking, so an error in
      # the config would otherwise reach the published site and only ever show
      # up in an editor. Before the build, so a type error fails fast.
      - name: Typecheck
        run: mise run docs:typecheck

      # `mise run` rather than `bun run build`, so DOCS_BASE handling and the
      # install-then-build order stay declared once, in mise.toml.
      - name: Build
        run: mise run docs:build

      # `bun.lock` -- the single workspace lockfile at the repository root, not
      # a second one under `docs/` -- is tracked as the supply-chain record. An install that
      # rewrites it means the manifest and the lock disagree, which is worth
      # failing on here rather than discovering as a silent dependency drift.
      - name: Check the lockfile was not rewritten
        run: git diff --exit-code -- bun.lock

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs/build
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Deploy to Pages
    needs: build
    # `inputs.publish` is truthy rather than compared to 'true': a boolean
    # workflow_dispatch input arrives as a real boolean, and GitHub casts both
    # sides to numbers on a mixed comparison, so `true == 'true'` is false.
    # `inputs.publish` is the whole condition now. The `github.event_name ==
    # 'push'` clause this replaces became dead the moment the push trigger was
    # removed, so it read as a second publish path while granting none -- and it
    # was the only thing keeping the site publishing at all.
    if: ${{ needs.build.result == 'success' && inputs.publish }}
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 10
    # `pages: write` + `id-token: write` are what the Pages ARTIFACT deployment
    # needs: `deploy-pages` mints an OIDC token to prove to the Pages service
    # that this workflow run produced the artifact. `contents: write` is gone
    # with the branch push -- nothing here commits to the repository any more,
    # which is the security win of the switch as much as the ergonomic one.
    permissions:
      contents: read
      pages: write
      id-token: write
    # The deployment shows on the repo's Environments page with this URL, and
    # `deploy-pages` supplies the value through its `page_url` output.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # No checkout, and no bot identity. Both existed only to commit the built
      # site onto a branch; an artifact deployment publishes without a commit,
      # so this job never needs the repository on disk.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: dist

      # The Pages ARTIFACT path, not a branch push. The repository's Pages
      # source is "GitHub Actions" (`build_type: workflow`), and a repo can
      # serve from exactly one source -- so this and a `gh-pages` branch push
      # are mutually exclusive, not complementary.
      #
      # `upload-pages-artifact` is not `upload-artifact` with a different name:
      # it tars the directory and publishes it under the reserved name
      # `github-pages`, which is the only artifact `deploy-pages` will read.
      # The plain `docs-site` artifact the build job uploads stays as it is --
      # it is what a reviewer downloads from a pull request, where nothing
      # deploys.
      #
      # Deployment REPLACES the site wholesale, which the branch push did not.
      # `keep_files: true` there meant nothing was ever deleted, so a renamed
      # page kept serving its old URL indefinitely. Now a removed page 404s on
      # the next deploy. That is the intended behaviour -- the site matches the
      # commit that produced it -- but it is a real change: any URL that only
      # existed because of that accumulation will stop resolving.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # `github.repository` is the STRING "owner/repo", not an object, so
      # `github.repository.name` resolves to empty. `github.event.repository.name`
      # is the field that carries it, and using it keeps the Marketplace/Release
      # links below correct if the repository is ever renamed. This does NOT
      # keep `docusaurus.config.ts` in sync: its `baseUrl` is the literal
      # `process.env.DOCS_BASE ?? "/rust-toolchain/"`, not derived from the
      # repository name, so a rename still needs that value updated by hand.
      # `steps.deploy.outputs.page_url` rather than a URL assembled from the
      # owner and repo. The Pages service is the authority on where the site
      # actually landed -- a custom domain, or a user/organisation site served
      # from the root, both make the constructed form wrong -- and it now comes
      # back from the deployment itself.
      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
          SITE: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -eo pipefail

          {
            echo "## Documentation published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Site** | <${SITE}> |"
            echo "| **Commit** | \`${SHA}\` |"
            echo "| **Source** | Pages artifact (\`github-pages\` environment) |"
            if [ -n "${VERSION}" ]; then
              echo "| **Version** | \`v${VERSION}\` |"
            fi
            echo ""
            echo "### Also published"
            echo ""
            # No docs.rs entry. The upstream this came from published a crate, so
            # it linked the API reference docs.rs builds automatically. This
            # repository publishes a GitHub Action; there is no crate and no
            # docs.rs page, so the equivalent surface is the Marketplace listing.
            echo "- Marketplace: <https://github.com/marketplace/actions/rust-toolchain-and-cache>"
            if [ -n "${VERSION}" ]; then
              echo "- Release: <https://github.com/${OWNER}/${REPO}/releases/tag/v${VERSION}>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Site: ${SITE}"
