name: act

on: push

jobs:
  test-action:
    name: Test Action
    runs-on: ubuntu-latest

    strategy:
      # Limits execution to 1 job at a time (sequential execution)
      max-parallel: 1

      # Optional: Stops the rest of the sequence if a job fails
      fail-fast: true

      matrix:
        include:
          - name: "1.97 with toml config"
            toolchain: ""
            targets: ""
            components: ""
            profile: ""
            expected: "1.97"
            unexpected: ""
            # No `cargo-binstall` here, and it is not an oversight: `ensureTools`
            # installs with `cargo install --locked`, always from source, and
            # cargo-binstall's tree does not finish inside
            # CARGO_INSTALL_TIMEOUT_MS (15 min). Measured: three attempts, each
            # killed with `spawnSync cargo ETIMEDOUT`, 46m22s total before the
            # step failed. The tool that exists to avoid source builds cannot
            # itself be installed without one.
            #
            # `ignorefile-cli`, not `ignorefile`: the latter is the library half
            # of the same project and ships no binary, so `cargo install` exits
            # with "there is nothing to install".
            cargo-tools: "comply@0.1.1, ignorefile-cli@0.1.0"
            # Binaries, not crate names — `ignorefile-cli` installs `ign` and
            # `ignorefile`.
            tool-bins: "comply ignorefile ign"
            msrv-check: ""
            msrv-expected: ""
            toml: |
              [toolchain]
              channel = "1.97"
              targets = []
              components = []
              profile = "default"

          - name: "1.88 input overrides toml 1.97"
            toolchain: "1.88"
            targets: ""
            components: ""
            profile: ""
            expected: "1.88"
            unexpected: "1.97"
            # No tools on this row, and not from lack of trying: none of the
            # three build on 1.88. `comply` declares rust-version 1.95, and
            # `cargo-binstall` declares 1.79 but pins `vergen 10.0.1`, which
            # needs 1.95 — `--locked` means cargo cannot pick an older one.
            # Measured, not assumed: the run failed after 1m25s having retried
            # the compile three times. A crate's declared MSRV says nothing
            # about its locked dependency graph, so check the graph.
            cargo-tools: ""
            tool-bins: ""
            msrv-check: ""
            msrv-expected: ""
            toml: |
              [toolchain]
              channel = "1.97"
              targets = []
              components = []
              profile = "default"

          - name: "msrv check against the workspace graph"
            toolchain: "1.88"
            targets: ""
            components: ""
            profile: ""
            expected: "1.88"
            unexpected: ""
            cargo-tools: ""
            tool-bins: ""
            msrv-check: "warn"
            # This repository has no Cargo.toml, so the check cannot run and
            # must warn rather than fail — the degradation path, which is the
            # half most likely to regress unnoticed.
            msrv-expected: ""
            toml: |
              [toolchain]
              channel = "1.88"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: "true"
          submodules: "recursive"

      - name: Prepare Isolated Rustup Home
        shell: bash
        run: |
          # See act-matrix.yml for the full rationale: mutating the image's
          # pre-installed toolchain fails on overlayfs with EXDEV, because a
          # directory rename cannot cross from a lower image layer to the upper
          # one. A run-time-created RUSTUP_HOME keeps every rename in one layer.
          rustup_home="${RUNNER_TEMP:-/tmp}/rustup"
          mkdir -p "$rustup_home"
          echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$rustup_home"

      - name: Write rust-toolchain.toml
        if: matrix.toml != 'none'
        shell: bash
        run: |
          cat > rust-toolchain.toml << 'EOF'
          ${{ matrix.toml }}
          EOF
          cat rust-toolchain.toml

      - name: Setup Rust Toolchain And Cache
        id: rust-toolchain
        uses: ./
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.targets }}
          components: ${{ matrix.components }}
          profile: ${{ matrix.profile }}
          # There is no Cargo.lock in this repository, and hashFiles returns an
          # empty string for a glob matching nothing — which the action rejects.
          # Any real lockfile hash exercises the same code path.
          cache: true
          cache-key-hash: ${{ hashFiles('bun.lock') }}
          cache-key-suffix: act
          cargo-tools: ${{ matrix.cargo-tools }}
          msrv-check: ${{ matrix.msrv-check }}

      - name: Verify Cache Output
        shell: bash
        # Read through env rather than interpolating into the script: this is
        # also the only place the README's `restore-keys` expression is ever
        # evaluated by a real runner, and its block scalar must keep both lines
        # at identical indentation or the join separator gains leading spaces.
        #
        # `|| '{}'` is load-bearing, not defensive clutter. A step that failed
        # publishes no outputs, so `outputs.cache` is `''` and `fromJSON('')`
        # aborts the whole step with
        # `The template is not valid ... Error reading JToken from JsonReader`.
        # That error names a line number in this file and says nothing about
        # the real failure, so it reads as a workflow bug and BURIES the
        # action's own diagnostic. Seen for real in a downstream repo: the
        # action failed with a precise "`cache-key-hash` is required" message,
        # and two of the three errors on the run were this noise instead.
        # Falling back to an empty object keeps the assertions below intact —
        # they still fail, but on "registry cache key is empty", which is true
        # and actionable.
        env:
          CACHE_JSON: ${{ steps.rust-toolchain.outputs.cache }}
          REGISTRY_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache || '{}').layers.registry.key }}
          BUILD_KEY: ${{ fromJSON(steps.rust-toolchain.outputs.cache || '{}').layers.build.key }}
          REGISTRY_RESTORE_KEYS: |
            ${{ join(fromJSON(steps.rust-toolchain.outputs.cache || '{}').layers.registry.restoreKeys, '
            ') }}
        run: |
          echo "cache: $CACHE_JSON"
          echo "registry key: $REGISTRY_KEY"
          echo "build key: $BUILD_KEY"
          echo "registry restore-keys:"
          echo "$REGISTRY_RESTORE_KEYS"

          if [[ -z "$REGISTRY_KEY" ]]; then
            echo "registry cache key is empty"
            exit 1
          fi
          if [[ -z "$BUILD_KEY" ]]; then
            echo "build cache key is empty"
            exit 1
          fi
          # The widest rung, and the only one guaranteed present, is the bare
          # layer-os-arch prefix.
          if ! grep -qx "registry-${RUNNER_OS}-${RUNNER_ARCH}-" <<<"$REGISTRY_RESTORE_KEYS"; then
            echo "join() did not produce one restore key per line"
            exit 1
          fi

      - name: Verify Cachekey Output
        shell: bash
        run: |
          echo "cachekey: ${{ steps.rust-toolchain.outputs.cachekey }}"
          echo "name: ${{ steps.rust-toolchain.outputs.name }}"
          if [[ -z "${{ steps.rust-toolchain.outputs.cachekey }}" ]]; then
            echo "cachekey is empty"
            exit 1
          fi
          if [[ -z "${{ steps.rust-toolchain.outputs.name }}" ]]; then
            echo "name is empty"
            exit 1
          fi

      - name: Verify MSRV Outputs
        if: matrix.msrv-check != ''
        shell: bash
        env:
          MSRV: ${{ steps.rust-toolchain.outputs.msrv }}
          MSRV_EFFECTIVE: ${{ steps.rust-toolchain.outputs.msrv-effective }}
          MSRV_SOURCE: ${{ steps.rust-toolchain.outputs.msrv-source }}
          EXPECTED: ${{ matrix.msrv-expected }}
        run: |
          echo "msrv:           $MSRV"
          echo "msrv-effective: $MSRV_EFFECTIVE"
          echo "msrv-source:    $MSRV_SOURCE"

          if [[ "$MSRV" != "$EXPECTED" ]]; then
            echo "msrv is '$MSRV', expected '$EXPECTED'"
            exit 1
          fi
          # The check cannot run here, so the source must say so rather than
          # inventing a value.
          if [[ -z "$EXPECTED" && "$MSRV_SOURCE" != "none" ]]; then
            echo "msrv-source is '$MSRV_SOURCE', expected 'none'"
            exit 1
          fi

      - name: Verify Isolated Rustup Home Was Used
        shell: bash
        run: |
          actual=$(rustup show home)
          echo "rustup home: $actual"
          if [[ "$actual" != "$RUSTUP_HOME" ]]; then
            echo "expected rustup home $RUSTUP_HOME, got $actual"
            exit 1
          fi

      - name: Verify Effective Toolchain
        shell: bash
        run: |
          # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml, so the action's
          # resolved channel is what later steps actually run.
          expected="${{ matrix.expected }}"
          echo "RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-<unset>}"
          if [[ -z "${RUSTUP_TOOLCHAIN:-}" ]]; then
            echo "RUSTUP_TOOLCHAIN was not exported"
            exit 1
          fi

          active=$(rustup show active-toolchain)
          echo "active toolchain: $active (expected prefix: $expected)"
          if [[ "$active" != "$expected"-* ]]; then
            echo "active toolchain is not $expected"
            exit 1
          fi

          version=$(rustc --version)
          echo "rustc: $version"
          if [[ "$expected" =~ ^[0-9] ]]; then
            if [[ "$version" != *"$expected"* ]]; then
                echo "rustc is not $expected"
                exit 1
              fi
          fi

      - name: Verify Toml Was Read But Lost To The Input
        if: matrix.unexpected != ''
        shell: bash
        # The provenance blocks are the only evidence that distinguishes "the
        # input won" from "the toml was never parsed". Both produce a resolved
        # 1.88, but only the first is the documented contract: a toml whose
        # channel is ignored must still contribute its targets, components and
        # profile, and it cannot do that if it was skipped outright.
        env:
          RESOLVED: ${{ steps.rust-toolchain.outputs.toolchain }}
          # `|| '{}'` for the reason spelled out on Verify Cache Output above:
          # an unguarded fromJSON over a failed step's empty output replaces the
          # action's real error with a template error pointing here.
          FROM_INPUT: ${{ fromJSON(steps.rust-toolchain.outputs.json || '{}').inputs.toolchain }}
          FROM_TOML: ${{ fromJSON(steps.rust-toolchain.outputs.json || '{}').toml.channel }}
          EXPECTED: ${{ matrix.expected }}
          UNEXPECTED: ${{ matrix.unexpected }}
        run: |
          echo "resolved toolchain: $RESOLVED"
          echo "inputs.toolchain:   $FROM_INPUT"
          echo "toml.channel:       $FROM_TOML"

          if [[ "$RESOLVED" != "$EXPECTED" ]]; then
            echo "resolved toolchain is $RESOLVED, expected $EXPECTED"
            exit 1
          fi
          if [[ "$FROM_INPUT" != "$EXPECTED" ]]; then
            echo "inputs provenance is $FROM_INPUT, expected $EXPECTED"
            exit 1
          fi
          # The losing channel must still be reported, verbatim, as what the
          # file asked for.
          if [[ "$FROM_TOML" != "$UNEXPECTED" ]]; then
            echo "toml provenance is $FROM_TOML, expected $UNEXPECTED"
            exit 1
          fi

      - name: Verify Overridden Channel Was Never Installed
        if: matrix.unexpected != ''
        shell: bash
        env:
          UNEXPECTED: ${{ matrix.unexpected }}
        run: |
          installed=$(rustup toolchain list)
          echo "$installed"

          # Anchored, with the dots escaped, so "1.97" cannot match inside a
          # longer version and a substring match cannot pass for a real one.
          if grep -qE "^${UNEXPECTED//./\\.}-" <<<"$installed"; then
            echo "$UNEXPECTED was installed; the input should have replaced it"
            exit 1
          fi

      - name: Verify Cargo Tools Installed
        if: matrix.cargo-tools != ''
        shell: bash
        # Asserts the *binaries*, not the crate names. They diverge here:
        # `ignorefile-cli` installs `ign` and `ignorefile`, which also means the
        # action's `<name> --version` probe can never find it under its own
        # crate name and will reinstall it on every run — the `bin` layer cannot
        # help a tool it is unable to recognise.
        env:
          RESOLVED: ${{ steps.rust-toolchain.outputs.cargo-tools }}
          TOOL_BINS: ${{ matrix.tool-bins }}
        run: |
          echo "cargo-tools output: $RESOLVED"

          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          for tool in $TOOL_BINS; do
            if [[ ! -x "$bin/$tool" ]]; then
              echo "$tool is not in $bin"
              find "$bin" -maxdepth 1 -mindepth 1 -exec basename {} \; | sort
              exit 1
            fi
            echo "  present: $tool"
          done

          # An unresolvable crate degrades to UNRESOLVED_VERSION rather than
          # throwing, so a registry outage would otherwise pass silently here.
          if [[ "$RESOLVED" == *UNRESOLVED_VERSION* ]]; then
            echo "a tool version never resolved: $RESOLVED"
            exit 1
          fi

      - name: Verify Rust Installed
        shell: bash
        run: |
          rustc --version
          rustup target list --installed
          rustup component list --installed

      - name: Verify Expected Target
        if: matrix.targets != ''
        shell: bash
        run: |
          targets="${{ matrix.targets }}"
          for target in $(echo "$targets" | tr ',' '\n'); do
            target=$(echo "$target" | xargs)
            if ! rustup target list --installed | grep -q "$target"; then
                echo "target $target not installed"
                exit 1
              fi
          done

      - name: Verify Expected Component
        if: matrix.components != ''
        shell: bash
        run: |
          comps="${{ matrix.components }}"
          for comp in $(echo "$comps" | tr ',' '\n'); do
            comp=$(echo "$comp" | xargs)
            if ! rustup component list --installed | grep -q "$comp"; then
                echo "component $comp not installed"
                exit 1
              fi
          done

      - name: Verify Default Toolchain
        shell: bash
        run: |
          expected="${{ matrix.expected }}"
          actual=$(rustup default) || { echo "rustup default failed"; exit 1; }
          echo "default toolchain: $actual (expected prefix: $expected)"
          if [[ "$actual" != "$expected"-* ]]; then
            echo "default toolchain is not $expected"
            exit 1
          fi

      - name: Verify Resolved Toolchain Persists Beside A Toml
        shell: bash
        # The last step in the job, deliberately: every assertion above reads
        # the toolchain in the same step the action ran in, which cannot tell an
        # exported `RUSTUP_TOOLCHAIN` from one that merely survived a single
        # step. This runs cargo in a *fresh directory carrying the losing toml*,
        # which is the only arrangement where the override chain is actually
        # exercised — `rust-toolchain.toml` sits at precedence 4 and beats
        # `rustup default`, so without the exported variable at precedence 2
        # cargo here would resolve the toml's channel and download it.
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          echo "RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-<unset>}"

          work="${RUNNER_TEMP:-/tmp}/persistence"
          rm -rf "$work"
          cargo new --bin "$work" >/dev/null

          # Outside the checkout, so nothing here can be answered by the
          # workspace itself; the toml is copied in so the directory makes the
          # same claim the checkout does.
          if [[ -f rust-toolchain.toml ]]; then
            cp rust-toolchain.toml "$work/rust-toolchain.toml"
            echo "copied toml:"
            cat "$work/rust-toolchain.toml"
          fi

          cd "$work"

          version=$(rustc --version)
          echo "rustc beside the toml: $version"
          if [[ "$version" != *"$EXPECTED"* ]]; then
            echo "rustc is not $EXPECTED; the toml won at use time"
            exit 1
          fi

          # A real compile, not just a version probe: the proxies pick the
          # toolchain per invocation, so building is what proves cargo and rustc
          # agree on it.
          cargo build 2>&1 | tail -n 5
