name: "Rust Toolchain"
description: >
  Install a Rust toolchain with rustup, driven by the rust-toolchain.toml you
  already committed, and cache cargo for you. Exports RUSTUP_TOOLCHAIN so the
  resolved channel wins in every later step rather than losing to a pinned
  toml, and publishes the merged channel, targets, components and profile as
  typed outputs with provenance. With cache enabled it restores the registry
  and target layers before the toolchain is used and saves them again from a
  post step, keyed separately so a compiler bump does not re-download the
  crates it never touched — no actions/cache step and no Swatinem/rust-cache
  needed, though the derived keys are published if you would rather wire your
  own. A superset of dtolnay/rust-toolchain, whose cachekey output it matches
  byte for byte.

author: "elioseverojunior@gmail.com"

branding:
  icon: "terminal"
  color: "orange"

inputs:
  toolchain:
    description: >
      Rust toolchain channel. Supports literal channels (stable, nightly, beta),
      versioned channels (1.89.0), expressive formats (stable 6 months ago,
      stable minus 3 releases), and <major.minor> series (1.62), which rustup
      resolves to the newest patch in that series.
      When omitted, reads from rust-toolchain.toml.
    required: false

  targets:
    description: >
      Comma, space, or newline-separated list of target triples to install
      (e.g., wasm32-unknown-unknown, aarch64-apple-darwin). Merged with
      rust-toolchain.toml targets, deduped, with these leading the list — so
      the `target` output names one of yours whenever you set this.
    required: false

  target:
    description: >
      Single target triple (alias for targets). Useful when only one target
      is needed.
    required: false

  components:
    description: >
      Comma, space, or newline-separated list of components to install (e.g.,
      clippy, rustfmt). Accepts multiline YAML for readability. Merged with
      rust-toolchain.toml components, deduped, with these leading the list.
    required: false

  profile:
    description: >
      Rust profile to use. Valid options are `minimal`, `default` and
      `complete`; anything else is rejected. Overrides the rust-toolchain.toml
      profile. Defaults to `default` (rustc, cargo, rust-std, rust-docs,
      rustfmt, clippy), matching rustup's own default. rustup ignores the
      profile when the toolchain is already installed, so the action also adds
      the profile's components explicitly. `complete` requires `toolchain:
      nightly` — it needs miri and rustc-codegen-cranelift, which rustup
      publishes for nightly only, and pairing it with another channel fails the
      step immediately.
    required: false

  set-rustup-toolchain:
    description: >
      Whether to export `RUSTUP_TOOLCHAIN` for the rest of the job (default
      true). It sits at precedence 2 in rustup's override chain, above every
      `rust-toolchain.toml` in the tree, which is what makes an action input
      actually win in later steps. Set to false in a monorepo where nested
      crates pin their own toolchains and each `rust-toolchain.toml` should
      keep applying to its own directory. Every output still describes the
      toolchain this action installed either way.
    required: false
    default: "true"

  cache:
    description: >
      Whether to cache cargo's registry and target directory (default false).
      When true, the action restores every enabled layer (see `cache-layers`)
      before the toolchain is used, and saves it again from a `post:` step at
      the end of the job — no `actions/cache` step and no
      `Swatinem/rust-cache` are needed. The `cache` output still carries each
      layer's key and restore-key ladder, for a workflow that would rather
      wire its own `actions/cache` steps instead.
    required: false
    default: "false"

  cache-key-hash:
    description: >
      A hash of the dependency set, required when `cache` is true. Pass the
      workflow expression `hashFiles('**/Cargo.lock')` wrapped in the usual
      interpolation braces — `hashFiles` is a workflow expression function
      that a Node action cannot call, and using GitHub's own value keeps
      these keys interoperable with caches you already have. Without it the
      keys never change: they hit exactly on every run and serve the same
      crates for the life of the repository. The README's caching section
      shows the full step. Note this text deliberately avoids writing the
      interpolation braces literally: an expression inside action metadata
      is not an expression context, and `act` rejects the whole action with
      "expressions are not allowed here" before any code runs.
    required: false

  cache-key-suffix:
    description: >
      An optional discriminator added to every cache key, e.g. a job name.
      Omitting it collapses the slot rather than leaving an empty segment, so
      the key reads `registry-Linux-X64-<hash>` and not
      `registry-Linux-X64--<hash>`. You do not need it to separate jobs that
      differ in `RUSTFLAGS`, or in any other variable whose name begins with
      `CARGO_`, `CC`, `CFLAGS`, `CXX`, `CMAKE` or `RUST` — every one of those
      is hashed into the `build` key already, so such jobs no longer share one.
      (Prefixes rather than wildcards on purpose: the README table is generated
      from this text as HTML, where a pair of asterisks reads as emphasis and
      swallows the underscores between them.)
      Reach for it when the thing that
      distinguishes two jobs is not an environment variable at all: two jobs
      building the same crate with the same flags for different purposes, say,
      or one you want kept out of another's restore ladder. May not contain a
      comma or whitespace.
    required: false

  cache-layers:
    description: >
      Which cache layers to derive keys for, comma, space or newline
      separated. Defaults to all of them. `registry` covers the downloaded
      crates and is keyed on the dependency set alone; `build` covers the
      target directory and is keyed on the dependency set plus the resolved
      toolchain, so a rustc bump does not invalidate the crates it never
      touched.
    required: false
    default: "registry,build"

  cache-workspaces:
    description: >
      Cargo workspaces to cache build artifacts for, one
      `<manifest-dir> -> <target-dir>` mapping per line. Both sides resolve
      against the workspace root, and a mapping resolving outside it is
      rejected. Matches the syntax Swatinem/rust-cache uses, so an existing
      value transfers unchanged.
    required: false
    default: ". -> target"

  cache-budget:
    description: >
      Largest cache entry to save per layer, as a byte count with an optional
      K, M, G or T suffix; binary rather than decimal. A layer exceeding it is
      not saved, and the step warns with the measured size. Set to 0 to
      disable. Defaults to 2GB because an oversized entry does not degrade its
      own hit rate — it evicts other workflows' caches out of the repository's
      shared budget.
    required: false
    default: "2GB"

  cache-on-failure:
    description: >
      Whether to save the cache when the job failed (default false). A failed
      job usually has a partial or poisoned `target/`, so saving it by default
      would serve those artifacts to the next run. Turn it on for a long build
      that fails late and would otherwise restart from nothing.
    required: false
    default: "false"

outputs:
  cachekey:
    description: >
      12-character cache key derived from rustc version date and commit hash,
      compatible with dtolnay/rust-toolchain's cachekey output for seamless
      cache interoperability.

  cachekey-full:
    description: >
      The cachekey above extended with a digest of the resolved channel,
      targets, components and profile. Two jobs on the same compiler but with
      different targets share a `cachekey` and would restore each other's
      artifacts; this key keeps them apart. Targets and components are sorted,
      so writing the same set in a different order still hits the same key.

  cache:
    description: >
      The derived cache keys as one JSON object: `enabled`, plus a `layers`
      map from layer name to `{ key, restoreKeys }` — and, once a layer has
      actually been restored, `result` (`exact`, `partial` or `miss`). Empty
      when `cache` is false. Read it with `fromJSON()`; a workflow wiring its
      own `actions/cache` steps instead of relying on the lifecycle can feed
      the parts straight in.

  cache-hit:
    description: >
      `true` only when every enabled cache layer matched its exact key. A
      partial match through a restore key counts as false, because the layer
      will be saved again under the new key.

  name:
    description: >
      Resolved Rust toolchain channel name (e.g., stable, nightly-2025-01-01,
      1.89.0).

  toolchain:
    description: >
      The resolved channel, after merging `rust-toolchain.toml` with the
      inputs and expanding any expressive form — `stable minus 2 releases`
      comes back as the `1.NN` it became. Same value as `name`, which is kept
      under that name for dtolnay/rust-toolchain compatibility.

  targets:
    description: >
      The target triples actually installed, as a JSON array string (e.g.
      `["wasm32-unknown-unknown","aarch64-apple-darwin"]`). A JSON array rather
      than a delimited string so `fromJSON()` reads it directly and no consumer
      has to guess the separator. Inputs lead the list, then any the toml added.

  target:
    description: >
      The first entry of `targets`, for the common job that installs exactly
      one, or an empty string when none were requested. Because inputs lead the
      merged list, this is the caller's own target whenever they named one.

  components:
    description: >
      The components explicitly requested through the inputs or the toml, as a
      JSON array string (e.g. `["clippy","rustfmt"]`). Components implied by
      the profile are not listed here — those are best-effort and are not part
      of the requested configuration.

  profile:
    description: >
      The resolved profile — `minimal`, `default` or `complete`. Always
      populated, since an unset profile resolves to `default`.

  set-rustup-toolchain:
    description: >
      Whether `RUSTUP_TOOLCHAIN` was exported for the rest of the job, as
      `true` or `false`, after applying the default.

  json:
    description: >
      Every output above as one JSON object, natively typed — `targets` and
      `components` are real arrays and `set-rustup-toolchain` is a real boolean,
      so `fromJSON(steps.<id>.outputs.json).targets` drops straight into a
      matrix. It also adds two provenance blocks the flat outputs cannot carry:
      `inputs`, the toolchain inputs verbatim, and `toml`, the parsed
      `rust-toolchain.toml` before merging. Together they say where every
      resolved value came from — absent toml scalars are `null`, unset inputs
      are empty strings. `inputs` covers only the inputs a
      `rust-toolchain.toml` can also supply, plus `set-rustup-toolchain`; the
      `cache-*` inputs have no toml counterpart and are reported through the
      `cache` output instead.

runs:
  using: "node24"
  main: "dist/index.js"
  post: "dist/index.js"
  post-if: "success() || env.RUST_TOOLCHAIN_CACHE_ON_FAILURE == 'true'"
